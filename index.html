    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) { registration.unregister(); }
            });
        }

        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#FF5E00', 600: '#E05200', glow: 'rgba(255, 94, 0, 0.4)', blue: '#3b82f6' },
                        dark: { 950: '#050507', 900: '#0a0a0c', 800: '#131318', 700: '#1d1d24', 600: '#2c2c35' }
                    },
                    animation: {
                        'toast-down': 'toastDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'fade-in': 'fadeIn 0.25s ease-out forwards',
                        'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        toastDown: {
                            '0%': { transform: 'translate(-50%, -120%)', opacity: 0 },
                            '100%': { transform: 'translate(-50%, 0)', opacity: 1 },
                        },
                        fadeIn: {
                            '0%': { opacity: 0, transform: 'translateY(-6px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(100%)' },
                            '100%': { transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; background-color: #050507; color: #f3f3f6; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .app-container { max-width: 480px; margin: 0 auto; min-height: 100vh; background-color: #0a0a0c; border-left: 1px solid #1e1e24; border-right: 1px solid #1e1e24; box-shadow: 0 0 50px rgba(0,0,0,0.9); position: relative; overflow: hidden; }

        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        .bg-watermark {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 140px;
            color: rgba(255, 255, 255, 0.015);
            pointer-events: none;
            z-index: 0;
            transform: rotate(-15deg);
        }
        
        .glass-panel { background: rgba(22, 22, 28, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.06); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .glass-header { background: rgba(10, 10, 12, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.06); }

</head>
<body class="antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const SUPABASE_URL = 'https://pncnnvbdquzyvcnuethx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_5WHz-KSuu5BaV08EGXJJmg_dkVOUJwy';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const EXERCISE_CATALOG = [
            { name: "Prensa 45° (Máquina)", muscle: "Cuádriceps", equip: "Máquina", image: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=150&auto=format&fit=crop", description: "Apoyá la espalda completamente. Pies en el centro de la plataforma ancho de hombros. Empujá con el talón y media planta, evitando estirar y bloquear las rodillas por completo." },
            { name: "Prensa Horizontal Tumbado", muscle: "Cuádriceps", equip: "Máquina", image: "https://images.unsplash.com/photo-1584466977773-e625c37cdd50?q=80&w=150&auto=format&fit=crop", description: "Misma biomecánica que la prensa 45° pero el vector de fuerza es horizontal. Evitá despegar la cadera del asiento al flexionar." },
            { name: "Sentadilla (Máquina Smith)", muscle: "Glúteos", equip: "Máquina", image: "https://images.unsplash.com/photo-1574680096145-d05b474e2155?q=80&w=150&auto=format&fit=crop", description: "Adelantá ligeramente los pies para mayor enfoque en glúteos. Bajá profundo controlando la fase excéntrica y subí empujando con los talones." },
            { name: "Sentadilla A Una Pierna Asistida", muscle: "Cuádriceps", equip: "Peso Corporal", description: "Usá un soporte (TRX, poste) para equilibrarte. Bajá con una sola pierna manteniendo el talón firme. Gran trabajo de estabilización." },
            { name: "Sentadilla Barra Alta", muscle: "Cuádriceps", equip: "Barra", description: "Barra apoyada sobre los trapecios. Pecho arriba, bajá rompiendo el paralelo si tu movilidad lo permite. Empuje vertical." },
            { name: "Sentadilla Búlgara", muscle: "Cuádriceps", equip: "Mancuernas", description: "Apoyá el empeine del pie trasero en un banco. Flexioná la pierna delantera hasta que el muslo esté paralelo al suelo. Mantené el torso firme." },
            { name: "Peso Muerto Rumano", muscle: "Isquiosurales", equip: "Barra", description: "Flexión leve de rodillas, empujá la cadera hacia atrás sintiendo el estiramiento en los isquios. Mantené la barra pegada a las piernas." },
            { name: "Hip Thrust", muscle: "Glúteos", equip: "Barra", description: "Espalda alta apoyada en el banco. Empujá con los talones y apretá los glúteos al máximo en la parte superior. No arquees la zona lumbar." },
            { name: "Press de Banca Plano", muscle: "Pecho", equip: "Barra", description: "Retracción escapular firme. Bajá la barra hasta la parte media/baja del pecho y empujá explosivo. Mantené los pies firmes en el suelo." },
            { name: "Dominadas", muscle: "Espalda", equip: "Peso Corporal", description: "Agarre prono más ancho que los hombros. Traccioná llevando el pecho hacia la barra, deprimiendo las escápulas." },
            { name: "Remo con Barra", muscle: "Espalda", equip: "Barra", description: "Incliná el torso a unos 45-60 grados. Traccioná la barra hacia el ombligo, juntando las escápulas en la contracción." },
            { name: "Press Militar", muscle: "Hombros", equip: "Barra", description: "De pie o sentado. Empujá la barra verticalmente sin usar impulso de las piernas. Contraé abdomen para proteger la lumbar." },
            { name: "Elevaciones Laterales", muscle: "Hombros", equip: "Mancuernas", description: "Elevá las mancuernas hacia los lados con una ligerísima flexión de codo. El meñique debe apuntar ligeramente hacia arriba." },
            { name: "Curl de Bíceps", muscle: "Bíceps", equip: "Mancuernas", description: "Mantené los codos fijos a los costados del cuerpo. Subí contrayendo el bíceps y bajá de forma controlada (fase excéntrica)." },
            { name: "Plancha Isométrica", muscle: "Abdomen", equip: "Peso Corporal", description: "Apoyo de antebrazos y puntas de pies. Cuerpo en línea recta. Apretá glúteos y abdomen durante todo el tiempo estipulado." }
            // Acá siguen todos los demás ejercicios que tenías (se omiten para no alargar visualmente este texto, pero el código los banca perfectos).
        ];

        let audioCtx = null;
        const unlockAudio = () => {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        };

        document.addEventListener('touchstart', unlockAudio, { once: true });
        document.addEventListener('click', unlockAudio, { once: true });

        const playAlarm = () => {
            try {
                if (!audioCtx) unlockAudio();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); 
                oscillator.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.2); 
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime); 
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.6); 
            } catch(e) { console.log("Audio falló", e); }
        };

        function ExerciseCatalogModal({ onClose, onSelect }) {
            const [searchTerm, setSearchTerm] = useState('');
            const [muscleFilter, setMuscleFilter] = useState('');

            const filteredExercises = EXERCISE_CATALOG.filter(ex => {
                const matchesSearch = ex.name.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesMuscle = muscleFilter === '' || ex.muscle === muscleFilter;
                return matchesSearch && matchesMuscle;
            });

            const uniqueMuscles = [...new Set(EXERCISE_CATALOG.map(ex => ex.muscle))].filter(Boolean).sort();

            return (
                <div className="absolute inset-0 z-[100] bg-dark-900 flex flex-col animate-slide-up h-full w-full">
                    <header className="px-4 py-4 flex items-center justify-between glass-header">
                        <button onClick={onClose} className="w-10 h-10 flex items-center justify-center text-white"><i className="fa-solid fa-arrow-left text-lg"></i></button>
                        <h2 className="text-white font-bold text-lg">Añadir Ejercicio</h2>
                        <button onClick={() => {
                            const customName = prompt("Nombre del ejercicio personalizado:");
                            if(customName) onSelect(customName);
                        }} className="text-brand-blue font-semibold text-base pr-2">Crear</button>
                    </header>

                    <div className="p-4 border-b border-white/5 bg-dark-900/95 backdrop-blur-md">
                        <div className="bg-dark-800 rounded-xl p-3 flex items-center gap-3 mb-4 border border-white/5">
                            <i className="fa-solid fa-magnifying-glass text-gray-500"></i>
                            <input 
                                type="text" 
                                placeholder="Buscar ejercicio" 
                                className="bg-transparent outline-none text-white w-full placeholder-gray-500"
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                            />
                            {searchTerm && <button onClick={() => setSearchTerm('')} className="text-gray-500"><i className="fa-solid fa-xmark"></i></button>}
                        </div>

                        <div className="flex gap-3 overflow-x-auto hide-scrollbar pb-1">
                            <button onClick={() => setMuscleFilter('')} className={`whitespace-nowrap px-4 py-2 rounded-xl text-sm font-semibold transition-colors ${muscleFilter === '' ? 'bg-white text-black' : 'bg-dark-800 text-gray-300 border border-white/5'}`}>Todos</button>
                            {uniqueMuscles.map(m => (
                                <button key={m} onClick={() => setMuscleFilter(m)} className={`whitespace-nowrap px-4 py-2 rounded-xl text-sm font-semibold transition-colors ${muscleFilter === m ? 'bg-white text-black' : 'bg-dark-800 text-gray-300 border border-white/5'}`}>
                                    {m}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto px-4 py-2 hide-scrollbar bg-dark-950">
                        <h3 className="text-white font-bold text-lg mb-4 mt-2">Ejercicios</h3>
                        <div className="space-y-1 pb-10">
                            {filteredExercises.map((ex, idx) => (
                                <div key={idx} onClick={() => onSelect(ex.name)} className="flex items-center justify-between py-3 cursor-pointer hover:bg-white/5 rounded-xl px-2 transition-colors group">
                                    <div className="flex items-center gap-4">
                                        <div className="w-12 h-12 rounded-full bg-white flex items-center justify-center shrink-0 shadow-md overflow-hidden border border-white/10 group-hover:border-brand-500 transition-colors">
                                            {ex.image ? (
                                                <img src={ex.image} alt={ex.name} className="w-full h-full object-cover" />
                                            ) : (
                                                <i className="fa-solid fa-dumbbell text-dark-900 text-xl"></i>
                                            )}
                                        </div>
                                        <div>
                                            <h4 className="text-white font-medium text-base leading-tight group-hover:text-brand-500 transition-colors">{ex.name}</h4>
                                            <p className="text-gray-400 text-sm mt-0.5">{ex.muscle || 'Varios'} {ex.equip ? `• ${ex.equip}` : ''}</p>
                                        </div>
                                    </div>
                                    <button className="text-gray-500 hover:text-white px-2"><i className="fa-solid fa-plus text-lg text-brand-500"></i></button>
                                </div>
                            ))}
                            {filteredExercises.length === 0 && (
                                <div className="text-center text-gray-500 mt-10">No se encontraron ejercicios.</div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function EditableTitle({ initialValue, placeholder, className, onSave }) {
            const inputRef = useRef(null);
            useEffect(() => {
                if (inputRef.current && inputRef.current.value !== initialValue) {
                    inputRef.current.value = initialValue || '';
                }
            }, [initialValue]);

            return (
                <input 
                    ref={inputRef}
                    type="text"
                    defaultValue={initialValue || ''}
                    placeholder={placeholder}
                    className={className}
                    onBlur={(e) => onSave(e.target.value)}
                    onKeyDown={(e) => { if (e.key === 'Enter') e.target.blur(); }}
                />
            );
        }

        // --- COMPONENTE MODAL DE INFORMACIÓN DEL EJERCICIO ---
        function ExerciseInfoModal({ exercise, isTeacher, onClose, onUpdate }) {
            const [localDesc, setLocalDesc] = useState(exercise.description || '');
            const [localLink, setLocalLink] = useState(exercise.link || '');

            const handleSave = () => {
                if (isTeacher && onUpdate) {
                    onUpdate({ ...exercise, description: localDesc, link: localLink });
                }
                onClose();
            };

            return (
                <div className="fixed inset-0 z-[200] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in" onClick={handleSave}>
                    <div className="bg-dark-900 border border-brand-500/30 p-6 rounded-3xl w-full max-w-sm shadow-2xl relative" onClick={e => e.stopPropagation()}>
                        <button onClick={handleSave} className="absolute top-4 right-4 text-gray-500 hover:text-white"><i className="fa-solid fa-xmark text-xl"></i></button>
                        
                        <div className="flex items-center gap-4 mb-5 pr-6">
                            {exercise.image ? (
                                <img src={exercise.image} alt={exercise.name} className="w-16 h-16 rounded-2xl object-cover border border-white/10 shrink-0" />
                            ) : (
                                <div className="w-16 h-16 bg-dark-800 rounded-2xl flex items-center justify-center text-brand-500 text-2xl shrink-0"><i className="fa-solid fa-dumbbell"></i></div>
                            )}
                            <div>
                                <h3 className="text-white font-bold text-lg leading-tight">{exercise.name}</h3>
                                <p className="text-brand-500 text-xs font-black uppercase tracking-widest mt-1">{exercise.muscle || 'Músculo'} • {exercise.equip || 'Equipamiento'}</p>
                            </div>
                        </div>

                        <div className="bg-dark-800 rounded-2xl p-4 border border-white/5 flex flex-col gap-3">
                            <h4 className="text-xs text-gray-400 font-bold uppercase tracking-wider"><i className="fa-solid fa-book-open text-brand-500 mr-1.5"></i> Técnica / Detalles</h4>
                            
                            {isTeacher ? (
                                <textarea 
                                    className="w-full bg-dark-900 text-gray-200 p-3 rounded-xl outline-none border border-dark-600 focus:border-brand-500 text-sm resize-none"
                                    rows="4"
                                    placeholder="Escribí acá la técnica, tips o postura requerida..."
                                    value={localDesc}
                                    onChange={(e) => setLocalDesc(e.target.value)}
                                />
                            ) : (
                                <p className="text-gray-300 text-sm leading-relaxed">{exercise.description || 'Sin descripción detallada por el momento.'}</p>
                            )}

                            {isTeacher ? (
                                <div className="mt-2">
                                    <h4 className="text-xs text-gray-400 font-bold uppercase tracking-wider mb-2"><i className="fa-solid fa-link text-brand-500 mr-1.5"></i> Enlace a Video</h4>
                                    <input 
                                        type="url"
                                        className="w-full bg-dark-900 text-gray-200 p-3 rounded-xl outline-none border border-dark-600 focus:border-brand-500 text-sm"
                                        placeholder="Ej: https://youtube.com/..."
                                        value={localLink}
                                        onChange={(e) => setLocalLink(e.target.value)}
                                    />
                                </div>
                            ) : (
                                exercise.link && (
                                    <a href={exercise.link} target="_blank" rel="noopener noreferrer" className="mt-2 bg-dark-900 hover:bg-black p-3 rounded-xl flex items-center justify-center gap-2 text-brand-500 font-bold text-sm border border-brand-500/30 transition-colors shadow-inner">
                                        <i className="fa-brands fa-youtube text-red-500 text-lg"></i> Ver video explicativo
                                    </a>
                                )
                            )}
                        </div>

                        {isTeacher && (
                            <button onClick={handleSave} className="w-full mt-6 bg-brand-500 text-white font-bold py-3.5 rounded-xl border border-brand-500 shadow-lg shadow-brand-500/30 hover:bg-brand-600 transition-colors">Guardar Ficha</button>
                        )}
                    </div>
                </div>
            );
        }

        function ExerciseRow({ exercise, clientProgress, onUpdate, onDelete }) {
            const [localEx, setLocalEx] = useState(exercise);
            const [editWeek, setEditWeek] = useState(1); 
            const [showInfoModal, setShowInfoModal] = useState(false);

            useEffect(() => {
                setLocalEx(exercise);
            }, [exercise]);

            const handleChange = (field, value) => {
                const updated = { ...localEx, [field]: value };
                setLocalEx(updated);
            };

            const handleWeekConfigChange = (weekNum, field, value) => {
                const updatedWeeks = structuredClone(localEx.weeks || {});
                if (!updatedWeeks[weekNum]) {
                    updatedWeeks[weekNum] = { sets: localEx.sets || '4', reps: localEx.reps || '10' };
                }
                updatedWeeks[weekNum][field] = value;
                const updated = { ...localEx, weeks: updatedWeeks };
                setLocalEx(updated);
                onUpdate(updated);
            };
            
            const handleBlur = () => {
                setTimeout(() => {
                    onUpdate(localEx);
                }, 250);
            };

            const currentWeekData = localEx.weeks?.[editWeek] || { sets: localEx.sets || '4', reps: localEx.reps || '10' };

            const exerciseNotes = [];
            if (clientProgress) {
                [1,2,3,4].forEach(w => {
                    const note = clientProgress[w]?.[localEx.id]?.note;
                    if (note && note.trim() !== '') {
                        exerciseNotes.push({ week: w, note });
                    }
                });
            }

            return (
                <div className="glass-panel p-4 rounded-2xl mb-4 relative z-10 shadow-xl border border-white/5">
                    {showInfoModal && (
                        <ExerciseInfoModal 
                            exercise={localEx} 
                            isTeacher={true} 
                            onClose={() => setShowInfoModal(false)}
                            onUpdate={(updatedEx) => { setLocalEx(updatedEx); onUpdate(updatedEx); }}
                        />
                    )}

                    <div className="flex justify-between items-start mb-3 relative">
                        <div className="w-5/6 relative flex items-center">
                            <input 
                                className="bg-transparent font-bold text-lg outline-none w-full text-white placeholder-gray-500 tracking-wide" 
                                value={localEx.name} 
                                onChange={(e) => handleChange('name', e.target.value)} 
                                onBlur={handleBlur} 
                                placeholder="Nombre del ejercicio" 
                            />
                        </div>
                        <div className="flex items-center gap-1">
                            <button onClick={() => setShowInfoModal(true)} className="text-brand-500 hover:text-white transition-colors px-2 py-1"><i className="fa-solid fa-circle-info text-lg"></i></button>
                            <button onClick={onDelete} className="text-gray-500 hover:text-red-400 transition-colors px-2 py-1"><i className="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>

                    <div className="mb-3 pt-1">
                        <div className="flex items-center justify-between mb-2">
                            <span className="text-[10px] font-black text-brand-500 uppercase tracking-widest">Programación Semanal:</span>
                            <div className="flex bg-dark-900 rounded-lg p-0.5 border border-dark-600">
                                {[1, 2, 3, 4].map(w => (
                                    <button key={w} type="button" onClick={() => setEditWeek(w)} className={`px-3 py-1 text-xs font-bold rounded-md transition-all ${editWeek === w ? 'bg-brand-500 text-white shadow-md' : 'text-gray-400 hover:text-white'}`}>S{w}</button>
                                ))}
                            </div>
                        </div>

                        <div className="flex gap-4 text-sm text-gray-300 items-center bg-dark-900/60 p-3 rounded-xl border border-dark-600">
                            <div className="flex items-center gap-2 flex-1">
                                <span className="text-xs text-gray-400">Series:</span>
                                <input className="w-12 bg-dark-700 rounded-lg p-1.5 text-center text-white font-bold outline-none border border-dark-600 focus:border-brand-500" value={currentWeekData.sets} onChange={(e) => handleWeekConfigChange(editWeek, 'sets', e.target.value)} onBlur={handleBlur} />
                            </div>
                            <div className="flex items-center gap-2 flex-1">
                                <span className="text-xs text-gray-400">Reps:</span>
                                <input className="w-12 bg-dark-700 rounded-lg p-1.5 text-center text-white font-bold outline-none border border-dark-600 focus:border-brand-500" value={currentWeekData.reps} onChange={(e) => handleWeekConfigChange(editWeek, 'reps', e.target.value)} onBlur={handleBlur} />
                            </div>
                        </div>
                    </div>

                    <div className="flex gap-4 text-sm text-gray-400 items-center py-1">
                        <div className="text-xs flex items-center gap-1.5">
                            RIR <input className="w-10 bg-dark-900 rounded-lg p-1.5 text-center text-white font-bold outline-none border border-dark-600 focus:border-brand-500" value={localEx.rir || '2'} onChange={(e) => handleChange('rir', e.target.value)} onBlur={handleBlur} />
                        </div>
                        <div className="flex items-center gap-1.5">
                            <i className="fa-regular fa-clock text-brand-500"></i> <input className="w-14 bg-dark-900 rounded-lg p-1.5 text-center text-white font-bold outline-none border border-dark-600 focus:border-brand-500 text-xs" value={localEx.rest || '90s'} onChange={(e) => handleChange('rest', e.target.value)} onBlur={handleBlur} placeholder="90s" />
                        </div>
                    </div>
                    
                    <div className="mt-3 pt-3 border-t border-dark-600 flex items-center gap-2.5">
                        <input type="checkbox" id={`uni-${localEx.id}`} checked={localEx.isUnilateral || false} onChange={(e) => {handleChange('isUnilateral', e.target.checked); handleBlur();}} className="w-4 h-4 accent-brand-500 rounded cursor-pointer" />
                        <label htmlFor={`uni-${localEx.id}`} className="text-xs text-gray-300 cursor-pointer select-none font-medium">Ejercicio Unilateral (Separar Izq/Der)</label>
                    </div>

                    <div className="mt-3">
                        <textarea 
                            className="w-full bg-dark-900/80 text-gray-200 p-3 rounded-xl outline-none border border-dark-600 focus:border-brand-500 text-sm resize-none box-border"
                            rows="2"
                            placeholder="Aclaraciones o notas rápidas para la sesión..."
                            value={localEx.coachNote || ''}
                            onChange={(e) => handleChange('coachNote', e.target.value)}
                            onBlur={handleBlur}
                        />
                    </div>

                    {exerciseNotes.length > 0 && (
                        <div className="mt-3 bg-brand-500/10 p-3 rounded-xl border border-brand-500/30">
                            <span className="text-brand-500 text-xs font-bold flex items-center gap-2 mb-2"><i className="fa-solid fa-comment-dots"></i> Feedback del alumno:</span>
                            {exerciseNotes.map(en => (
                                <div key={en.week} className="text-xs text-gray-300 mb-1 last:mb-0"><strong className="text-brand-500">Semana {en.week}:</strong> {en.note}</div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        function ClientExerciseRow({ exercise, activeWeek, progressData, previousWeekData, allWeeksData, onSaveProgress, onStartRest, showToast }) {
            const weekConfig = exercise.weeks?.[activeWeek] || { sets: exercise.sets || '4', reps: exercise.reps || '10' };
            const baseSetsCount = parseInt(weekConfig.sets) || 1;
            const isUni = exercise.isUnilateral === true;
            const totalRows = isUni ? baseSetsCount * 2 : baseSetsCount;

            const [showNotes, setShowNotes] = useState(false);
            const [showHistory, setShowHistory] = useState(false);
            const [showInfoModal, setShowInfoModal] = useState(false);
            const [localNote, setLocalNote] = useState(progressData?.note || '');

            const [localSets, setLocalSets] = useState(() => {
                const saved = progressData?.sets;
                if (saved && saved.length > 0) return saved;
                return Array.from({length: totalRows}, () => ({ weight: '', reps: '', rir: '', done: false, type: 'N' }));
            });

            useEffect(() => {
                const saved = progressData?.sets;
                if (saved && saved.length > 0) {
                    setLocalSets(saved);
                } else {
                    setLocalSets(Array.from({length: totalRows}, () => ({ weight: '', reps: '', rir: '', done: false, type: 'N' })));
                }
                setLocalNote(progressData?.note || '');
            }, [progressData, totalRows, activeWeek]);

            const updateSetLocal = (index, field, value) => {
                const newSets = structuredClone(localSets);
                newSets[index][field] = value;
                setLocalSets(newSets);
            };

            const handleSetBlur = () => { onSaveProgress(localSets, localNote); };

            const toggleDone = (index) => {
                unlockAudio();
                const newSets = structuredClone(localSets);
                const wasDone = newSets[index].done;
                newSets[index].done = !wasDone;
                setLocalSets(newSets);
                onSaveProgress(newSets, localNote);
                if (!wasDone) onStartRest(exercise.rest || '90s');
            };

            const handleNoteChange = (e) => { setLocalNote(e.target.value); };
            const handleNoteBlur = () => { onSaveProgress(localSets, localNote); };

            const addSet = () => {
                const addCount = isUni ? 2 : 1;
                const newSets = structuredClone(localSets);
                for(let i=0; i<addCount; i++){
                    newSets.push({ weight: '', reps: '', rir: '', done: false, type: 'N' });
                }
                setLocalSets(newSets);
                onSaveProgress(newSets, localNote);
            };

            const cycleSetType = (index) => {
                const types = ['N', 'W', 'D'];
                const current = localSets[index].type || 'N';
                const next = types[(types.indexOf(current) + 1) % types.length];
                updateSetLocal(index, 'type', next);
                handleSetBlur();
            };

            const adjustWeight = (index, amount) => {
                const currentVal = parseFloat(localSets[index].weight);
                let newVal = isNaN(currentVal) ? (amount > 0 ? 2.5 : 0) : Math.max(0, currentVal + amount);
                const updatedSets = structuredClone(localSets);
                updatedSets[index].weight = newVal === 0 ? '' : newVal.toString();
                setLocalSets(updatedSets);
                onSaveProgress(updatedSets, localNote);
            };

            return (
                <div className="mb-10 relative z-10">
                    {showInfoModal && (
                        <ExerciseInfoModal 
                            exercise={exercise} 
                            isTeacher={false} 
                            onClose={() => setShowInfoModal(false)} 
                        />
                    )}

                    <div className="flex items-center justify-between mb-4">
                        <div className="flex items-center gap-3">
                            <div className="w-11 h-11 bg-dark-700 rounded-2xl flex items-center justify-center text-brand-500 shadow-lg border border-white/5 overflow-hidden">
                                {exercise.image ? (
                                    <img src={exercise.image} alt={exercise.name} className="w-full h-full object-cover" />
                                ) : (
                                    <i className="fa-solid fa-dumbbell text-lg"></i>
                                )}
                            </div>
                            <div>
                                <h4 onClick={() => setShowInfoModal(true)} className="font-bold text-base text-white leading-tight tracking-wide cursor-pointer hover:text-brand-500 flex items-center gap-1.5 transition-colors group">
                                    {exercise.name} <i className="fa-solid fa-circle-info text-xs text-brand-500 opacity-60 group-hover:opacity-100 transition-opacity"></i>
                                </h4>
                                <span className="text-xs text-brand-500 font-semibold">Sem. {activeWeek} • Pauta: {weekConfig.sets}x{weekConfig.reps} (RIR {exercise.rir || '2'})</span>
                            </div>
                        </div>
                    </div>

                    {exercise.coachNote && (
                        <div className="bg-dark-800/90 border-l-4 border-brand-500 p-3 rounded-r-xl mb-4 flex gap-3 items-start shadow-inner">
                            <i className="fa-solid fa-circle-info text-brand-500 mt-0.5"></i>
                            <p className="text-xs text-gray-300 whitespace-pre-wrap leading-relaxed">{exercise.coachNote}</p>
                        </div>
                    )}

                    <div className="flex gap-2 mb-4">
                        <button onClick={() => {setShowHistory(!showHistory); setShowNotes(false);}} className={`text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-2 transition-all border ${showHistory ? 'bg-brand-500 text-white border-brand-500 shadow-md shadow-brand-500/25' : 'bg-dark-800 text-gray-300 border-dark-600 hover:bg-dark-700'}`}>
                            <i className="fa-solid fa-clock-rotate-left"></i> Historial
                        </button>
                        <button onClick={() => {setShowNotes(!showNotes); setShowHistory(false);}} className={`text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-2 transition-all border ${showNotes ? 'bg-brand-500 text-white border-brand-500 shadow-md shadow-brand-500/25' : 'bg-dark-800 text-gray-300 border-dark-600 hover:bg-dark-700'}`}>
                            <i className="fa-solid fa-pencil"></i> Notas personales
                        </button>
                    </div>

                    {showNotes && (
                        <div className="mb-4 animate-fade-in origin-top w-full box-border">
                            <textarea 
                                value={localNote} 
                                onChange={handleNoteChange} 
                                onBlur={handleNoteBlur}
                                placeholder="Anotá acá sensaciones, carga de máquina, etc..." 
                                className="w-full bg-dark-800 text-white p-3 rounded-xl outline-none border border-dark-600 focus:border-brand-500 text-sm resize-none h-24 shadow-inner box-border block"
                            />
                        </div>
                    )}

                    {showHistory && (
                        <div className="mb-4 bg-dark-800 p-4 rounded-xl border border-dark-600 animate-fade-in origin-top shadow-inner text-xs">
                            <h5 className="font-bold text-white mb-3 flex items-center gap-2"><i className="fa-solid fa-chart-simple text-brand-500"></i> Tus marcas este mesociclo</h5>
                            {[1, 2, 3, 4].map(w => {
                                const wData = allWeeksData?.[w]?.[exercise.id]?.sets;
                                if (!wData || wData.length === 0) return null;
                                return (
                                    <div key={w} className="mb-3 pb-3 border-b border-dark-700 last:border-0 last:mb-0 last:pb-0 text-gray-300">
                                        <span className="text-brand-500 font-bold block mb-1">Semana {w}:</span>
                                        <div className="flex flex-wrap gap-2">
                                            {wData.map((s, idx) => {
                                                if(s.weight && s.reps) return (
                                                    <span key={idx} className="bg-dark-700 px-2.5 py-1 rounded-lg text-xs border border-dark-600">{s.weight}kg x {s.reps} {s.rir !== undefined && s.rir !== '' ? `(RIR ${s.rir})` : ''}</span>
                                                );
                                                return null;
                                            })}
                                        </div>
                                    </div>
                                )
                            })}
                            {!allWeeksData && <p className="text-gray-500 italic">Aún no hay registros en otras semanas.</p>}
                        </div>
                    )}
                    
                    <div className="grid grid-cols-[36px_55px_1fr_65px_45px_42px] gap-1 mb-2 text-[10px] text-gray-400 font-black uppercase tracking-widest px-1 text-center items-center">
                        <span>Set</span>
                        <span>Previa</span>
                        <span>KG (±2.5)</span>
                        <span>Reps</span>
                        <span>RIR</span>
                        <span></span>
                    </div>
                    
                    {localSets.map((set, i) => {
                        const prevSet = previousWeekData?.sets?.[i];
                        const prevText = prevSet?.weight && prevSet?.reps ? `${prevSet.weight}x${prevSet.reps}` : '-';
                        
                        const isRight = isUni && (i % 2 !== 0);
                        const setNum = isUni ? Math.floor(i / 2) + 1 : i + 1;
                        const setType = set.type || 'N';
                        
                        let badgeText = setType === 'N' ? setNum : setType;
                        if (isUni) {
                            badgeText = `${badgeText}${isRight ? 'D' : 'I'}`;
                        }

                        let badgeStyle = "bg-dark-800 text-gray-400 border-dark-600";
                        if (setType === 'W') badgeStyle = "bg-orange-950/60 text-orange-400 border-orange-800";
                        else if (setType === 'D') badgeStyle = "bg-red-950/60 text-red-400 border-red-800";
                        else if (isUni) badgeStyle = isRight ? "bg-blue-950/60 text-blue-400 border-blue-900" : "bg-emerald-950/60 text-emerald-400 border-emerald-900";

                        return (
                            <div key={i} className="grid grid-cols-[36px_55px_1fr_65px_45px_42px] gap-1 items-center mb-2.5">
                                <button onClick={() => cycleSetType(i)} className={`w-9 h-10 flex items-center justify-center rounded-xl font-black text-xs border cursor-pointer hover:opacity-80 transition-opacity ${badgeStyle}`}>
                                    {badgeText}
                                </button>
                                
                                <div className="text-center text-gray-500 text-xs font-semibold truncate">
                                    {prevText}
                                </div>

                                <div className="flex items-center bg-dark-800 rounded-xl border border-dark-600 focus-within:border-brand-500 overflow-hidden shadow-inner">
                                    <button type="button" onClick={() => adjustWeight(i, -2.5)} className="w-7 h-10 text-gray-400 hover:text-white hover:bg-dark-700 transition-colors text-xs font-bold flex items-center justify-center">-</button>
                                    <input 
                                        type="text" 
                                        inputMode="decimal"
                                        className="w-full bg-transparent py-2.5 text-white outline-none text-center font-bold text-sm" 
                                        placeholder="-" 
                                        value={set.weight} 
                                        onChange={(e) => updateSetLocal(i, 'weight', e.target.value)} 
                                        onBlur={handleSetBlur}
                                    />
                                    <button type="button" onClick={() => adjustWeight(i, 2.5)} className="w-7 h-10 text-gray-400 hover:text-white hover:bg-dark-700 transition-colors text-xs font-bold flex items-center justify-center">+</button>
                                </div>
                                
                                <input 
                                    type="number" 
                                    className="w-full bg-dark-800 rounded-xl py-2.5 text-white outline-none text-center font-bold text-sm border border-dark-600 focus:border-brand-500 transition-colors box-border shadow-inner" 
                                    placeholder="-" 
                                    value={set.reps} 
                                    onChange={(e) => updateSetLocal(i, 'reps', e.target.value)} 
                                    onBlur={handleSetBlur}
                                />

                                <input 
                                    type="number" 
                                    className="w-full bg-dark-800 rounded-xl py-2.5 text-brand-500 outline-none text-center font-bold text-sm border border-dark-600 focus:border-brand-500 transition-colors box-border shadow-inner" 
                                    placeholder="RIR" 
                                    value={set.rir} 
                                    onChange={(e) => updateSetLocal(i, 'rir', e.target.value)} 
                                    onBlur={handleSetBlur}
                                />
                                
                                <button onClick={() => toggleDone(i)} className={`w-10 h-10 rounded-xl flex items-center justify-center transition-all box-border ${set.done ? 'bg-brand-500 text-white shadow-[0_0_15px_rgba(255,94,0,0.5)] font-bold scale-105' : 'bg-dark-800 text-gray-500 border border-dark-600 hover:text-white'}`}>
                                    <i className="fa-solid fa-check"></i>
                                </button>
                            </div>
                        )
                    })}
                    <button onClick={addSet} className="w-full mt-4 bg-dark-800 text-brand-500 font-bold py-3.5 rounded-xl text-xs uppercase tracking-wider border border-dark-600 hover:bg-dark-700 transition-colors box-border shadow-md">
                        + Añadir serie {isUni ? 'I/D' : ''}
                    </button>
                </div>
            );
        }

        function App() {
            const [globalData, setGlobalData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('home'); 
            const [currentUser, setCurrentUser] = useState(null);
            const [pinInput, setPinInput] = useState('');
            const [newClientName, setNewClientName] = useState('');
            const [activeClient, setActiveClient] = useState(null);
            const [activeDayId, setActiveDayId] = useState(null);
            
            const [activeWeek, setActiveWeek] = useState(1); 
            const [isTrainingStarted, setIsTrainingStarted] = useState(false);
            const [trainingTime, setTrainingTime] = useState(0);
            const [restTime, setRestTime] = useState(0); 
            
            const [catalogTarget, setCatalogTarget] = useState(null);

            const [toast, setToast] = useState(null);
            const showToast = (msg, type = 'info') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3000);
            };

            useEffect(() => {
                fetchData();
                const channel = supabase.channel('realtime_sync').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'bravo_state' }, (payload) => {
                    if(payload && payload.new) setGlobalData(payload.new.data);
                }).subscribe();
                return () => { supabase.removeChannel(channel); };
            }, []);

            useEffect(() => {
                let interval = null;
                if (view === 'cliente_entrenamiento' && isTrainingStarted) {
                    interval = setInterval(() => setTrainingTime(t => t + 1), 1000);
                } else { clearInterval(interval); }
                return () => clearInterval(interval);
            }, [view, isTrainingStarted]);

            useEffect(() => {
                let restInterval = null;
                if (restTime > 0) {
                    restInterval = setInterval(() => {
                        setRestTime(t => {
                            if (t <= 1) {
                                if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
                                playAlarm();
                                return 0;
                            }
                            return t - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(restInterval);
            }, [restTime]);

            const startRest = (timeString) => {
                if (!timeString) { setRestTime(90); return; }
                let str = timeString.toLowerCase().trim();
                let t = 0;
                if (str.includes(':')) {
                    const parts = str.split(':');
                    t = parseInt(parts[0] || 0) * 60 + parseInt(parts[1] || 0);
                } else if (str.includes('m')) {
                    const parts = str.split('m');
                    const m = parseInt(parts[0]) || 0;
                    const s = parseInt(parts[1]) || 0; 
                    t = m * 60 + s;
                } else {
                    t = parseInt(str) || 90; 
                }
                setRestTime(t || 90);
            };

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60).toString().padStart(2, '0');
                const s = (secs % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            const fetchData = async () => {
                try {
                    const { data } = await supabase.from('bravo_state').select('data').eq('id', 'main').single();
                    if (data && data.data) {
                        setGlobalData(data.data);
                    } else {
                        setGlobalData({ profesorPin: '0000', clients: [], routines: {}, progress: {} });
                    }
                } catch (e) { 
                    console.error(e);
                    setGlobalData({ profesorPin: '0000', clients: [], routines: {}, progress: {} });
                }
                setLoading(false);
            };

            const saveData = async (newData) => {
                setGlobalData(newData);
                const { error } = await supabase.from('bravo_state').update({ data: newData }).eq('id', 'main');
                if (error) {
                    showToast('Error de red al guardar en la nube', 'error');
                }
            };

            const handleLogin = () => {
                if (!globalData) return;
                unlockAudio(); 
                
                if (pinInput === globalData.profesorPin) { setView('profesor'); } 
                else {
                    const client = globalData.clients?.find(c => c.pin === pinInput);
                    if (client) { 
                        setCurrentUser(client); 
                        setView('cliente_listado'); 
                    } else { showToast('PIN incorrecto. Revisalo bien.', 'error'); }
                }
                setPinInput('');
            };

            const addClient = () => {
                if (!newClientName.trim()) return;
                const newData = structuredClone(globalData);
                const newClient = { id: Date.now().toString(), name: newClientName, pin: Math.floor(1000 + Math.random() * 9000).toString() };
                if(!newData.clients) newData.clients = [];
                if(!newData.routines) newData.routines = {};
                if(!newData.progress) newData.progress = {};
                newData.clients.push(newClient);
                newData.routines[newClient.id] = [];
                saveData(newData);
                setNewClientName('');
                showToast(`¡Alumno creado! PIN: ${newClient.pin}`);
            };

            const addDay = (clientId) => {
                const newData = structuredClone(globalData);
                const newId = Date.now().toString();
                newData.routines[clientId].push({ 
                    id: newId, 
                    name: "Nueva Plantilla", 
                    sections: [
                        { id: 'sec_1', name: 'Bloque Principal', exercises: [] }
                    ] 
                });
                saveData(newData);
            };

            const updateDayName = (clientId, dayId, newName) => {
                const newData = structuredClone(globalData);
                const day = newData.routines[clientId].find(d => d.id === dayId);
                if(day) day.name = newName;
                saveData(newData);
            };

            const deleteDay = (clientId, dayId) => {
                const confirmacion = window.confirm('¿Seguro que querés borrar esta plantilla entera?');
                if (!confirmacion) return;
                const newData = structuredClone(globalData);
                newData.routines[clientId] = newData.routines[clientId].filter(d => d.id !== dayId);
                saveData(newData);
                setActiveDayId(null);
                showToast('Plantilla eliminada');
            };

            const cloneDay = (clientId, dayId) => {
                const newData = structuredClone(globalData);
                const dayToClone = newData.routines[clientId].find(d => d.id === dayId);
                if (!dayToClone) return;

                const clonedSections = (dayToClone.sections || [{ name: 'Bloque Principal', exercises: dayToClone.exercises || [] }]).map(sec => ({
                    ...sec,
                    id: Math.random().toString(36).substr(2, 9),
                    exercises: sec.exercises.map(ex => ({
                        ...ex,
                        id: Math.random().toString(36).substr(2, 9)
                    }))
                }));

                const newDay = {
                    id: Date.now().toString(),
                    name: dayToClone.name + " (Copia)",
                    sections: clonedSections
                };

                newData.routines[clientId].push(newDay);
                saveData(newData);
                showToast('Plantilla duplicada con éxito');
            };

            const addSection = (clientId, dayId) => {
                const newData = structuredClone(globalData);
                const day = newData.routines[clientId].find(d => d.id === dayId);
                if(!day.sections) day.sections = [];
                day.sections.push({ id: Math.random().toString(36).substr(2, 9), name: 'Nuevo Bloque', exercises: [] });
                saveData(newData);
            };

            const updateSectionName = (clientId, dayId, secId, newName) => {
                const newData = structuredClone(globalData);
                const day = newData.routines[clientId].find(d => d.id === dayId);
                const sec = day.sections.find(s => s.id === secId);
                if(sec) sec.name = newName;
                saveData(newData);
            };

            const deleteSection = (clientId, dayId, secId) => {
                const newData = structuredClone(globalData);
                const day = newData.routines[clientId].find(d => d.id === dayId);
                day.sections = day.sections.filter(s => s.id !== secId);
                saveData(newData);
            };

            // Función disparada por el Catálogo
            const handleExerciseSelected = (exerciseName) => {
                if (!catalogTarget) return;
                
                const catInfo = EXERCISE_CATALOG.find(e => e.name === exerciseName);
                const imageUrl = catInfo ? catInfo.image : null;
                const description = catInfo ? catInfo.description : '';
                const muscle = catInfo ? catInfo.muscle : '';
                const equip = catInfo ? catInfo.equip : '';

                const { clientId, dayId, secId } = catalogTarget;
                const newData = structuredClone(globalData);
                const day = newData.routines[clientId].find(d => d.id === dayId);
                const sec = day.sections.find(s => s.id === secId);
                
                sec.exercises.push({ 
                    id: Math.random().toString(36).substr(2, 9), 
                    name: exerciseName,
                    image: imageUrl, 
                    description: description,
                    muscle: muscle,
                    equip: equip,
                    link: '',
                    sets: '4', reps: '10', rir: '2', rest: '90s', isUnilateral: false, weeks: {} 
                });
                
                saveData(newData);
                setCatalogTarget(null);
            };

            const updateExerciseInSection = (clientId, dayId, secId, updatedExercise) => {
                const newData = structuredClone(globalData);
                const day = newData.routines[clientId].find(d => d.id === dayId);
                const sec = day.sections.find(s => s.id === secId);
                const index = sec.exercises.findIndex(e => e.id === updatedExercise.id);
                sec.exercises[index] = updatedExercise;
                saveData(newData);
            };

            const deleteExerciseFromSection = (clientId, dayId, secId, exerciseId) => {
                const newData = structuredClone(globalData);
                const day = newData.routines[clientId].find(d => d.id === dayId);
                const sec = day.sections.find(s => s.id === secId);
                sec.exercises = sec.exercises.filter(e => e.id !== exerciseId);
                saveData(newData);
            };

            const saveClientProgress = (exerciseId, setsArray, noteString, week) => {
                const newData = structuredClone(globalData);
                if (!newData.progress[currentUser.id]) newData.progress[currentUser.id] = {};
                if (!newData.progress[currentUser.id][week]) newData.progress[currentUser.id][week] = {};
                if (!newData.progress[currentUser.id][week][exerciseId]) newData.progress[currentUser.id][week][exerciseId] = {};
                
                if (setsArray) newData.progress[currentUser.id][week][exerciseId].sets = setsArray;
                if (noteString !== undefined) newData.progress[currentUser.id][week][exerciseId].note = noteString;
                
                saveData(newData);
            };

            if (loading) return <div className="app-container flex justify-center items-center h-screen bg-dark-900 text-brand-500 text-2xl font-bold"><i className="fa-solid fa-fire fa-spin mr-3"></i> Cargando...</div>;

            return (
                <div className="relative">
                    <div className="bg-watermark"><i className="fa-solid fa-dumbbell"></i></div>

                    {catalogTarget && (
                        <ExerciseCatalogModal 
                            onClose={() => setCatalogTarget(null)} 
                            onSelect={handleExerciseSelected} 
                        />
                    )}

                    {toast && (
                        <div className={`fixed top-6 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-2xl text-sm font-bold shadow-2xl animate-toast-down text-center flex items-center gap-3 whitespace-nowrap ${toast.type === 'error' ? 'bg-red-600 text-white' : 'bg-brand-500 text-white shadow-brand-500/40'}`}>
                            {toast.type === 'error' ? <i className="fa-solid fa-triangle-exclamation"></i> : <i className="fa-solid fa-bolt"></i>}
                            {toast.msg}
                        </div>
                    )}

                    {view === 'home' && (
                        <div className="app-container flex flex-col justify-between p-6 bg-dark-900 h-screen relative z-10">
                            <div></div>
                            <div className="text-center animate-fade-in my-auto">
                                <div className="inline-flex justify-center items-center w-24 h-24 bg-dark-800 rounded-3xl border border-brand-500/30 text-brand-500 mb-6 shadow-[0_0_30px_rgba(255,94,0,0.2)]">
                                    <i className="fa-solid fa-fire text-4xl"></i>
                                </div>
                                <h1 className="text-3xl font-black text-white uppercase tracking-wider mb-1">Entrenamiento</h1>
                                <h2 className="text-lg font-bold text-brand-500 tracking-widest uppercase">y salud</h2>
                            </div>
                            <div className="glass-panel p-6 rounded-3xl shadow-2xl mb-4 border border-white/5">
                                <input type="password" placeholder="INGRESA TU PIN" className="w-full bg-dark-900 p-4 rounded-2xl text-center text-xl tracking-[0.4em] outline-none mb-4 text-white border border-dark-600 focus:border-brand-500 transition-colors font-bold placeholder:tracking-normal placeholder:font-normal placeholder:text-gray-500 shadow-inner" value={pinInput} onChange={(e) => setPinInput(e.target.value)} />
                                <button onClick={handleLogin} className="w-full bg-brand-500 text-white py-4 rounded-2xl font-black text-base hover:bg-brand-600 transition-all shadow-lg shadow-brand-500/30 uppercase tracking-wider">Entrar</button>
                            </div>
                        </div>
                    )}

                    {view === 'profesor' && (
                        <div className="app-container pb-20 relative z-10">
                            {activeClient ? (
                                activeDayId && globalData.routines[activeClient.id]?.find(d => d.id === activeDayId) ? (
                                    <>
                                        <header className="p-4 flex items-center justify-between sticky top-0 glass-header z-50">
                                            <button onClick={() => setActiveDayId(null)} className="text-brand-500 w-10 h-10 flex items-center justify-center hover:text-white transition-colors bg-dark-800 rounded-xl border border-white/5"><i className="fa-solid fa-arrow-left text-base"></i></button>
                                            <h2 className="font-bold text-base text-white tracking-wide">Editar Plantilla</h2>
                                            <div className="w-10"></div>
                                        </header>
                                        <div className="p-4">
                                            <EditableTitle 
                                                initialValue={globalData.routines[activeClient.id].find(d => d.id === activeDayId).name}
                                                placeholder="Nombre del día..."
                                                className="font-black text-2xl lowercase bg-transparent outline-none text-white w-full mb-6 border-b border-dark-700 pb-2 focus:border-brand-500 transition-colors placeholder-gray-600"
                                                onSave={(val) => updateDayName(activeClient.id, activeDayId, val)}
                                            />
                                            
                                            {(() => {
                                                const day = globalData.routines[activeClient.id].find(d => d.id === activeDayId);
                                                const sections = day.sections || [{ id: 'default', name: 'Bloque Principal', exercises: day.exercises || [] }];

                                                return (
                                                    <div className="space-y-6">
                                                        {sections.map((sec, secIdx) => (
                                                            <div key={sec.id || secIdx} className="bg-dark-800/80 backdrop-blur-md p-4 rounded-3xl border border-white/5 shadow-xl">
                                                                <div className="flex items-center justify-between mb-4 pb-2 border-b border-dark-700">
                                                                    <EditableTitle 
                                                                        initialValue={sec.name}
                                                                        placeholder="NOMBRE DEL BLOQUE..."
                                                                        className="bg-transparent font-black text-brand-500 text-sm uppercase tracking-wider outline-none w-3/4 placeholder-gray-500"
                                                                        onSave={(val) => updateSectionName(activeClient.id, activeDayId, sec.id, val)}
                                                                    />
                                                                    {sections.length > 1 && (
                                                                        <button onClick={() => deleteSection(activeClient.id, activeDayId, sec.id)} className="text-gray-500 hover:text-red-400 transition-colors text-xs px-2 py-1"><i className="fa-solid fa-trash-can"></i></button>
                                                                    )}
                                                                </div>

                                                                {sec.exercises.map(ex => (
                                                                    <ExerciseRow 
                                                                        key={ex.id} 
                                                                        exercise={ex} 
                                                                        clientProgress={globalData.progress?.[activeClient.id]}
                                                                        onUpdate={(u) => updateExerciseInSection(activeClient.id, activeDayId, sec.id, u)} 
                                                                        onDelete={() => deleteExerciseFromSection(activeClient.id, activeDayId, sec.id, ex.id)} 
                                                                    />
                                                                ))}

                                                                <button onClick={() => setCatalogTarget({clientId: activeClient.id, dayId: activeDayId, secId: sec.id})} className="w-full bg-dark-700 text-brand-500 font-bold py-3.5 rounded-2xl mt-2 text-xs uppercase tracking-wider border border-white/5 hover:bg-dark-600 transition-colors shadow-sm flex items-center justify-center gap-2">
                                                                    <i className="fa-solid fa-magnifying-glass"></i> Añadir desde catálogo
                                                                </button>
                                                            </div>
                                                        ))}

                                                        <button onClick={() => addSection(activeClient.id, activeDayId)} className="w-full bg-dark-800 text-white font-bold py-4 rounded-2xl mt-4 border border-white/5 hover:bg-dark-700 transition-colors shadow-lg flex items-center justify-center gap-2 text-sm uppercase tracking-wide">
                                                            <i className="fa-solid fa-layer-group text-brand-500"></i> Nuevo bloque
                                                        </button>
                                                    </div>
                                                );
                                            })()}
                                        </div>
                                    </>
                                ) : (
                                    <>
                                        <header className="p-4 flex items-center justify-between sticky top-0 glass-header z-10">
                                            <button onClick={() => setActiveClient(null)} className="text-brand-500 w-10 h-10 flex items-center justify-center hover:text-white transition-colors bg-dark-800 rounded-xl border border-white/5"><i className="fa-solid fa-arrow-left text-base"></i></button>
                                            <h2 className="font-bold text-base text-white tracking-wide">{activeClient.name}</h2>
                                            <div className="w-10"></div>
                                        </header>
                                        
                                        <div className="p-4">
                                            <h3 className="font-black text-xs text-gray-400 uppercase tracking-widest mb-4">Plantillas asignadas</h3>
                                            <div className="space-y-4">
                                                {(globalData.routines[activeClient.id] || []).map(day => {
                                                    const totalEx = day.sections ? day.sections.reduce((acc, s) => acc + (s.exercises?.length || 0), 0) : (day.exercises?.length || 0);
                                                    return (
                                                        <div key={day.id} onClick={() => setActiveDayId(day.id)} className="glass-panel p-4 rounded-2xl flex items-center gap-4 cursor-pointer hover:border-brand-500/50 transition-all shadow-md group border border-white/5">
                                                            <div className="w-14 h-14 bg-dark-800 rounded-xl shrink-0 flex items-center justify-center text-brand-500 border border-dark-600 group-hover:scale-105 transition-transform">
                                                                <i className="fa-solid fa-dumbbell text-xl"></i>
                                                            </div>
                                                            <div className="flex-1 overflow-hidden">
                                                                <h4 className="font-bold text-base text-white truncate lowercase">{day.name}</h4>
                                                                <p className="text-xs text-gray-400 truncate mt-0.5">{totalEx} ejercicios programados</p>
                                                            </div>
                                                            <div className="flex items-center gap-1">
                                                                <button onClick={(e) => { e.stopPropagation(); cloneDay(activeClient.id, day.id); }} className="text-gray-400 p-2.5 hover:text-brand-500 transition-colors"><i className="fa-solid fa-copy"></i></button>
                                                                <button onClick={(e) => { e.stopPropagation(); deleteDay(activeClient.id, day.id); }} className="text-gray-400 p-2.5 hover:text-red-400 transition-colors"><i className="fa-solid fa-trash-can"></i></button>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                            <button onClick={() => addDay(activeClient.id)} className="mt-6 flex items-center justify-center gap-2 text-white font-black w-full bg-brand-500 p-4 rounded-2xl hover:bg-brand-600 transition-colors shadow-lg shadow-brand-500/30 uppercase text-xs tracking-wider">
                                                <i className="fa-regular fa-folder text-base"></i> Crear nueva plantilla
                                            </button>
                                        </div>
                                    </>
                                )
                            ) : (
                                <>
                                    <header className="p-5 flex justify-between items-center glass-header sticky top-0 z-10">
                                        <h2 className="font-black text-xl text-white uppercase tracking-wider">Panel Profe</h2>
                                        <button onClick={() => setView('home')} className="text-xs font-bold text-gray-400 bg-dark-800 px-4 py-2 rounded-xl hover:text-white transition-colors border border-white/5">Salir</button>
                                    </header>
                                    <div className="p-5 space-y-4">
                                        <div className="flex gap-2 bg-dark-800/80 p-2 rounded-2xl border border-white/5 shadow-inner mb-6">
                                            <input className="flex-1 bg-transparent px-4 outline-none text-sm text-white placeholder-gray-500 font-medium" placeholder="Nuevo alumno..." value={newClientName} onChange={(e) => setNewClientName(e.target.value)} />
                                            <button onClick={addClient} className="bg-brand-500 rounded-xl w-11 h-11 flex items-center justify-center text-white hover:bg-brand-600 transition-colors shadow-md shadow-brand-500/30 font-bold"><i className="fa-solid fa-plus"></i></button>
                                        </div>

                                        <h3 className="font-black text-xs text-gray-400 uppercase tracking-widest mb-2">Listado de Alumnos</h3>
                                        {globalData.clients?.map(client => (
                                            <div key={client.id} onClick={() => setActiveClient(client)} className="glass-panel p-4 rounded-2xl flex justify-between items-center cursor-pointer hover:border-brand-500/50 transition-all shadow-md border border-white/5">
                                                <div>
                                                    <p className="font-bold text-base text-white">{client.name}</p>
                                                    <p className="text-xs text-brand-500 mt-1 font-semibold"><i className="fa-solid fa-key mr-1"></i> PIN: {client.pin}</p>
                                                </div>
                                                <i className="fa-solid fa-chevron-right text-gray-500 text-sm"></i>
                                            </div>
                                        ))}
                                    </div>
                                </>
                            )}
                        </div>
                    )}

                    {view === 'cliente_listado' && (
                        <div className="app-container pb-24 relative z-10">
                            <header className="p-5 flex justify-between items-center sticky top-0 glass-header z-10">
                                <h1 className="text-sm font-black text-white tracking-widest flex items-center gap-2">
                                    <div className="w-7 h-7 bg-brand-500 rounded-lg flex items-center justify-center text-white text-xs shadow-md shadow-brand-500/40">
                                        <i className="fa-solid fa-fire"></i>
                                    </div>
                                    <span className="uppercase tracking-wider">Entrenamiento & Salud</span>
                                </h1>
                                <button onClick={() => setView('home')} className="text-white bg-dark-800 px-3.5 py-1.5 rounded-xl text-xs font-bold shadow-sm border border-white/5">Salir</button>
                            </header>

                            <div className="p-5">
                                <div className="mb-6 bg-dark-800/60 p-4 rounded-2xl border border-white/5">
                                    <h2 className="text-xl font-black text-white">Hola, {currentUser?.name || 'Atleta'}</h2>
                                    <p className="text-xs text-gray-400 mt-0.5">Seleccioná tu semana y a darlo todo.</p>
                                </div>

                                <h3 className="font-black text-xs text-gray-400 uppercase tracking-widest mb-3">Seleccionar semana</h3>
                                <div className="flex bg-dark-800/90 rounded-2xl p-1.5 mb-8 border border-white/5 shadow-inner">
                                    {[1, 2, 3, 4].map(num => (
                                        <button key={num} onClick={() => setActiveWeek(num)} className={`flex-1 py-2.5 text-xs font-black uppercase tracking-wider rounded-xl transition-all ${activeWeek === num ? 'bg-brand-500 text-white shadow-lg shadow-brand-500/30' : 'text-gray-400 hover:text-white'}`}>Sem. {num}</button>
                                    ))}
                                </div>

                                <h3 className="font-black text-xs text-gray-400 uppercase tracking-widest mb-4">Tus plantillas</h3>
                                <div className="space-y-4">
                                    {(globalData.routines[currentUser.id] || []).map(day => {
                                        const totalEx = day.sections ? day.sections.reduce((acc, s) => acc + (s.exercises?.length || 0), 0) : (day.exercises?.length || 0);
                                        return (
                                            <div key={day.id} onClick={() => {setActiveDayId(day.id); setIsTrainingStarted(false); setView('cliente_entrenamiento');}} className="glass-panel p-4 rounded-2xl flex items-center gap-4 cursor-pointer group hover:border-brand-500/50 transition-all shadow-md border border-white/5">
                                                <div className="w-14 h-14 bg-dark-800 rounded-2xl shrink-0 flex items-center justify-center text-brand-500 border border-dark-600 group-hover:scale-105 transition-transform shadow-inner">
                                                    <i className="fa-solid fa-dumbbell text-xl"></i>
                                                </div>
                                                <div className="flex-1 overflow-hidden">
                                                    <h4 className="font-bold text-base text-white truncate lowercase">{day.name}</h4>
                                                    <p className="text-xs text-gray-400 truncate mt-0.5">{totalEx} ejercicios programados</p>
                                                </div>
                                                <i className="fa-solid fa-chevron-right text-gray-600 text-xs pr-1"></i>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                            
                            <div className="fixed bottom-0 left-1/2 transform -translate-x-1/2 w-full max-w-[480px] bg-dark-900/95 backdrop-blur border-t border-white/5 flex justify-around p-3 text-gray-400 pb-5 z-20">
                                <button className="text-brand-500 flex flex-col items-center gap-1"><i className="fa-solid fa-dumbbell text-lg"></i><span className="text-[10px] font-black uppercase tracking-wider">Entrenar</span></button>
                                <button onClick={() => showToast('Próximamente: Estadísticas de progreso')} className="hover:text-white transition-colors flex flex-col items-center gap-1"><i className="fa-solid fa-chart-line text-lg"></i><span className="text-[10px] font-black uppercase tracking-wider">Progreso</span></button>
                                <button onClick={() => showToast('Próximamente: Perfil de usuario')} className="hover:text-white transition-colors flex flex-col items-center gap-1"><i className="fa-regular fa-user text-lg"></i><span className="text-[10px] font-black uppercase tracking-wider">Perfil</span></button>
                            </div>
                        </div>
                    )}

                    {view === 'cliente_entrenamiento' && (
                        !isTrainingStarted ? (
                            <div className="app-container pb-24 relative z-10">
                                <header className="p-4 flex items-center justify-between sticky top-0 glass-header z-10">
                                    <button onClick={() => setView('cliente_listado')} className="text-brand-500 w-10 h-10 flex items-center justify-center hover:text-white transition-colors bg-dark-800 rounded-xl border border-white/5"><i className="fa-solid fa-arrow-left text-base"></i></button>
                                    <button onClick={() => showToast('Próximamente: IA adaptativa')} className="bg-dark-800 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 border border-white/5 hover:border-brand-500 transition-colors"><i className="fa-solid fa-wand-magic-sparkles text-brand-500"></i> Adaptar</button>
                                </header>

                                <div className="p-5">
                                    <h2 className="font-black text-3xl lowercase text-white mb-1 tracking-tight">{(globalData.routines[currentUser.id]?.find(d => d.id === activeDayId) || {}).name}</h2>
                                    <p className="text-xs text-brand-500 font-black uppercase tracking-widest mb-8">Semana {activeWeek} del Mesociclo</p>

                                    {(() => {
                                        const day = globalData.routines[currentUser.id]?.find(d => d.id === activeDayId) || {};
                                        const sections = day.sections || [{ name: 'Bloque Principal', exercises: day.exercises || [] }];

                                        return (
                                            <div className="space-y-8">
                                                {sections.map((sec, sIdx) => (
                                                    <div key={sIdx}>
                                                        <h3 className="font-black text-xs text-brand-500 uppercase tracking-widest mb-3 border-b border-dark-700 pb-2">{sec.name}</h3>
