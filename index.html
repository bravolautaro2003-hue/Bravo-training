<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bravo Training</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel para compilar React en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { -webkit-tap-highlight-color: transparent; background-color: #000; }
        .app-container { max-width: 480px; margin: 0 auto; min-height: 100vh; background-color: #111827; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="text-white antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Credenciales de tu Supabase
        const SUPABASE_URL = 'https://pncnnvbdquzyvcnuethx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_5WHz-KSuu5BaV08EGXJJmg_dkVOUJwy';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Componente aislado para Ejercicios (Evita que se congele la app al escribir)
        function ExerciseRow({ exercise, onUpdate, onDelete }) {
            const [localEx, setLocalEx] = useState(exercise);

            // Actualiza la pantalla rápido
            const handleChange = (field, value) => {
                setLocalEx(prev => ({ ...prev, [field]: value }));
            };

            // Guarda en la base de datos cuando se saca el foco (onBlur)
            const handleBlur = () => {
                onUpdate(localEx);
            };

            return (
                <div className="bg-gray-900 p-3 rounded-lg border border-gray-700 flex flex-col gap-2 relative">
                    <button onClick={onDelete} className="absolute top-2 right-2 text-red-500 bg-red-500/10 w-8 h-8 rounded flex items-center justify-center">
                        <i className="fa-solid fa-trash text-sm"></i>
                    </button>
                    <input 
                        className="bg-transparent font-bold text-lg border-b border-gray-700 focus:border-blue-500 outline-none pb-1 w-5/6" 
                        value={localEx.name} 
                        onChange={(e) => handleChange('name', e.target.value)} 
                        onBlur={handleBlur} 
                        placeholder="Nombre del ejercicio" 
                    />
                    <div className="flex gap-2 text-sm mt-1">
                        <div className="flex-1">
                            <label className="text-gray-500 text-xs uppercase font-bold">Series</label>
                            <input className="w-full bg-gray-800 p-2 rounded text-center" value={localEx.sets} onChange={(e) => handleChange('sets', e.target.value)} onBlur={handleBlur} placeholder="Ej: 4" />
                        </div>
                        <div className="flex-1">
                            <label className="text-gray-500 text-xs uppercase font-bold">Reps</label>
                            <input className="w-full bg-gray-800 p-2 rounded text-center" value={localEx.reps} onChange={(e) => handleChange('reps', e.target.value)} onBlur={handleBlur} placeholder="Ej: 8-10" />
                        </div>
                        <div className="flex-1">
                            <label className="text-gray-500 text-xs uppercase font-bold">RIR</label>
                            <input className="w-full bg-gray-800 p-2 rounded text-center" value={localEx.rir} onChange={(e) => handleChange('rir', e.target.value)} onBlur={handleBlur} placeholder="Ej: 2" />
                        </div>
                    </div>
                </div>
            );
        }

        // Componente aislado para el progreso del Cliente
        function ClientExerciseRow({ exercise, progressData, onSaveProgress }) {
            const [localProg, setLocalProg] = useState({ 
                weight: progressData?.weight || '', 
                repsDone: progressData?.repsDone || '' 
            });

            const handleBlur = () => {
                onSaveProgress(localProg.weight, localProg.repsDone);
            };

            return (
                <div className="bg-gray-800 p-4 rounded-xl space-y-3 mb-4 shadow-lg border border-gray-700">
                    <div className="border-b border-gray-700 pb-3">
                        <h4 className="font-bold text-lg text-white">{exercise.name}</h4>
                        <p className="text-sm text-gray-400 mt-2 flex gap-2">
                            <span className="bg-gray-700 px-2 py-1 rounded text-xs font-bold">{exercise.sets} Series</span>
                            <span className="bg-gray-700 px-2 py-1 rounded text-xs font-bold">{exercise.reps} Reps</span>
                            <span className="bg-gray-700 px-2 py-1 rounded text-xs font-bold text-blue-400">RIR {exercise.rir}</span>
                        </p>
                    </div>
                    <div className="flex gap-2">
                        <input 
                            type="number" 
                            className="flex-1 bg-gray-900 border border-gray-700 p-3 rounded-lg text-white placeholder-gray-500" 
                            placeholder="Kilos levantados"
                            value={localProg.weight}
                            onChange={(e) => setLocalProg(prev => ({...prev, weight: e.target.value}))}
                            onBlur={handleBlur}
                        />
                        <input 
                            type="number" 
                            className="flex-1 bg-gray-900 border border-gray-700 p-3 rounded-lg text-white placeholder-gray-500" 
                            placeholder="Reps hechas"
                            value={localProg.repsDone}
                            onChange={(e) => setLocalProg(prev => ({...prev, repsDone: e.target.value}))}
                            onBlur={handleBlur}
                        />
                    </div>
                </div>
            );
        }

        // App Principal
        function App() {
            const [globalData, setGlobalData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('home'); 
            const [currentUser, setCurrentUser] = useState(null);
            const [pinInput, setPinInput] = useState('');
            const [newClientName, setNewClientName] = useState('');
            const [expandedClient, setExpandedClient] = useState(null); // Para acordeón de alumnos

            useEffect(() => {
                fetchData();
                const channel = supabase.channel('realtime_sync')
                    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'bravo_state' }, (payload) => {
                        setGlobalData(payload.new.data);
                    })
                    .subscribe();

                return () => { supabase.removeChannel(channel); };
            }, []);

            const fetchData = async () => {
                const { data, error } = await supabase.from('bravo_state').select('data').eq('id', 'main').single();
                if (data) setGlobalData(data.data);
                setLoading(false);
            };

            const saveData = async (newData) => {
                setGlobalData(newData);
                await supabase.from('bravo_state').update({ data: newData }).eq('id', 'main');
            };

            const handleLogin = () => {
                if (pinInput === globalData.profesorPin) {
                    setView('profesor');
                } else {
                    const client = globalData.clients?.find(c => c.pin === pinInput);
                    if (client) {
                        setCurrentUser(client);
                        setView('cliente');
                    } else {
                        alert('PIN incorrecto. Revisa el código.');
                    }
                }
                setPinInput('');
            };

            // ---- ACCIONES DEL PROFESOR ----
            const addClient = () => {
                if (!newClientName.trim()) return;
                const newData = JSON.parse(JSON.stringify(globalData));
                const pin = Math.floor(1000 + Math.random() * 9000).toString();
                const newClient = { id: Date.now().toString(), name: newClientName, pin };
                
                if(!newData.clients) newData.clients = [];
                if(!newData.routines) newData.routines = {};
                if(!newData.progress) newData.progress = {};

                newData.clients.push(newClient);
                newData.routines[newClient.id] = [];
                
                saveData(newData);
                setNewClientName('');
            };

            const addDay = (clientId) => {
                const newData = JSON.parse(JSON.stringify(globalData));
                newData.routines[clientId].push({
                    id: Date.now().toString(),
                    name: `Día ${newData.routines[clientId].length + 1}`,
                    exercises: []
                });
                saveData(newData);
            };

            const addExercise = (clientId, dayId) => {
                const newData = JSON.parse(JSON.stringify(globalData));
                const day = newData.routines[clientId].find(d => d.id === dayId);
                day.exercises.push({
                    id: Date.now().toString(),
                    name: 'Nuevo Ejercicio',
                    sets: '4', reps: '10', rir: '2'
                });
                saveData(newData);
            };

            const updateExercise = (clientId, dayId, updatedExercise) => {
                const newData = JSON.parse(JSON.stringify(globalData));
                const day = newData.routines[clientId].find(d => d.id === dayId);
                const index = day.exercises.findIndex(e => e.id === updatedExercise.id);
                day.exercises[index] = updatedExercise;
                saveData(newData);
            };

            const deleteExercise = (clientId, dayId, exerciseId) => {
                const newData = JSON.parse(JSON.stringify(globalData));
                const day = newData.routines[clientId].find(d => d.id === dayId);
                day.exercises = day.exercises.filter(e => e.id !== exerciseId);
                saveData(newData);
            };

            // ---- ACCIONES DEL CLIENTE ----
            const saveProgress = (exerciseId, weight, repsDone) => {
                const newData = JSON.parse(JSON.stringify(globalData));
                if (!newData.progress[currentUser.id]) newData.progress[currentUser.id] = {};
                newData.progress[currentUser.id][exerciseId] = { weight, repsDone };
                saveData(newData);
            };

            if (loading) return <div className="app-container flex items-center justify-center h-screen"><p className="text-blue-500 font-bold animate-pulse">Conectando a Supabase...</p></div>;

            // ---- VISTA: HOME / LOGIN ----
            if (view === 'home') return (
                <div className="app-container flex flex-col justify-center p-6 space-y-10">
                    <div className="text-center space-y-2">
                        <i className="fa-solid fa-dumbbell text-5xl text-blue-600 mb-4"></i>
                        <h1 className="text-4xl font-black tracking-tighter uppercase">Bravo <span className="text-blue-600">Training</span></h1>
                        <p className="text-gray-400 text-sm">Plataforma de periodización</p>
                    </div>
                    <div className="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-xl">
                        <label className="text-xs uppercase font-bold text-gray-400 block mb-2">Ingresar con PIN</label>
                        <input 
                            type="password" 
                            className="w-full bg-gray-900 border border-gray-600 p-4 rounded-xl text-center text-2xl tracking-[0.5em] focus:border-blue-500 outline-none mb-4" 
                            placeholder="****"
                            value={pinInput}
                            onChange={(e) => setPinInput(e.target.value)}
                        />
                        <button onClick={handleLogin} className="w-full bg-blue-600 hover:bg-blue-700 py-4 rounded-xl font-bold text-lg transition shadow-lg shadow-blue-600/30">
                            Entrar
                        </button>
                    </div>
                </div>
            );

            // ---- VISTA: PROFESOR ----
            if (view === 'profesor') return (
                <div className="app-container flex flex-col">
                    <header className="bg-gray-950 p-4 border-b border-gray-800 flex justify-between items-center sticky top-0 z-10">
                        <h2 className="font-bold text-lg flex items-center gap-2 text-blue-500">
                            <i className="fa-solid fa-user-gear"></i> Panel Profesor
                        </h2>
                        <button onClick={() => setView('home')} className="text-gray-400 p-2"><i className="fa-solid fa-arrow-right-from-bracket"></i></button>
                    </header>
                    <div className="p-4 space-y-6">
                        {/* Agregar Cliente */}
                        <div className="bg-blue-900/20 border border-blue-900 p-4 rounded-xl">
                            <h3 className="text-sm font-bold text-blue-400 mb-3 uppercase tracking-wide">Nuevo Alumno</h3>
                            <div className="flex gap-2">
                                <input className="flex-1 bg-gray-800 border border-gray-700 p-3 rounded-lg outline-none focus:border-blue-500" placeholder="Nombre completo" value={newClientName} onChange={(e) => setNewClientName(e.target.value)} />
                                <button onClick={addClient} className="bg-blue-600 px-5 rounded-lg font-bold"><i className="fa-solid fa-plus"></i></button>
                            </div>
                        </div>

                        {/* Lista de Clientes */}
                        <div className="space-y-4 pb-20">
                            {globalData.clients?.map(client => (
                                <div key={client.id} className="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
                                    <div 
                                        className="p-4 flex justify-between items-center cursor-pointer bg-gray-800 hover:bg-gray-750"
                                        onClick={() => setExpandedClient(expandedClient === client.id ? null : client.id)}
                                    >
                                        <div>
                                            <p className="font-bold text-lg">{client.name}</p>
                                            <p className="text-xs text-blue-400 mt-1 font-mono">PIN: {client.pin}</p>
                                        </div>
                                        <i className={`fa-solid fa-chevron-${expandedClient === client.id ? 'up' : 'down'} text-gray-500`}></i>
                                    </div>

                                    {/* Rutina del Cliente Expandido */}
                                    {expandedClient === client.id && (
                                        <div className="p-4 bg-gray-950 border-t border-gray-700 space-y-6">
                                            {globalData.routines[client.id]?.map(day => (
                                                <div key={day.id} className="space-y-3">
                                                    <h4 className="font-bold text-blue-500 border-b border-gray-800 pb-2">{day.name}</h4>
                                                    {day.exercises.map(ex => (
                                                        <ExerciseRow 
                                                            key={ex.id} 
                                                            exercise={ex} 
                                                            onUpdate={(updatedData) => updateExercise(client.id, day.id, updatedData)} 
                                                            onDelete={() => deleteExercise(client.id, day.id, ex.id)}
                                                        />
                                                    ))}
                                                    <button onClick={() => addExercise(client.id, day.id)} className="w-full py-3 border border-dashed border-gray-600 rounded-lg text-gray-400 text-sm font-bold hover:bg-gray-800 transition">
                                                        <i className="fa-solid fa-plus mr-2"></i> Agregar Ejercicio
                                                    </button>
                                                </div>
                                            ))}
                                            <button onClick={() => addDay(client.id)} className="w-full bg-blue-600 py-3 rounded-lg font-bold shadow-lg mt-4">
                                                Crear Día de Entrenamiento
                                            </button>
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            // ---- VISTA: CLIENTE ----
            if (view === 'cliente') return (
                <div className="app-container flex flex-col">
                    <header className="bg-gray-950 p-4 border-b border-gray-800 flex justify-between items-center sticky top-0 z-10">
                        <h2 className="font-bold text-lg flex items-center gap-2 text-blue-500">
                            <i className="fa-solid fa-clipboard-list"></i> Mi Rutina
                        </h2>
                        <div className="flex items-center gap-4">
                            <span className="text-sm font-bold">{currentUser.name}</span>
                            <button onClick={() => setView('home')} className="text-red-400 p-2"><i className="fa-solid fa-arrow-right-from-bracket"></i></button>
                        </div>
                    </header>
                    <div className="p-4 space-y-8 pb-20">
                        {globalData.routines[currentUser.id]?.length === 0 && (
                            <div className="text-center p-10 text-gray-500">Tu profe todavía no te cargó la rutina.</div>
                        )}
                        
                        {globalData.routines[currentUser.id]?.map(day => (
                            <div key={day.id}>
                                <div className="bg-blue-900/20 border border-blue-900 p-3 rounded-xl mb-4">
                                    <h3 className="font-bold text-xl text-white">{day.name}</h3>
                                </div>
                                {day.exercises.map(ex => (
                                    <ClientExerciseRow 
                                        key={ex.id} 
                                        exercise={ex}
