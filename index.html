                                                        <div className="space-y-3">
                                                            {sec.exercises?.map((ex) => {
                                                                const wCfg = ex.weeks?.[activeWeek] || { sets: ex.sets || '4', reps: ex.reps || '10' };
                                                                return (
                                                                    <div key={ex.id} className="glass-panel p-3.5 rounded-2xl flex gap-3.5 items-center border border-white/5 shadow-sm">
                                                                        <div className="w-12 h-12 bg-dark-800 rounded-2xl flex items-center justify-center shrink-0 border border-dark-600 text-brand-500 overflow-hidden">
                                                                            {ex.image ? (
                                                                                <img src={ex.image} alt={ex.name} className="w-full h-full object-cover" />
                                                                            ) : (
                                                                                <i className="fa-solid fa-dumbbell text-base"></i>
                                                                            )}
                                                                        </div>
                                                                        <div className="flex-1 overflow-hidden">
                                                                            <p className="text-[10px] text-brand-500 font-black mb-0.5 tracking-wider uppercase">{wCfg.sets} SERIES x {wCfg.reps} REPS • RIR {ex.rir || '2'}</p>
                                                                            <p className="font-bold text-white text-sm leading-tight truncate">{ex.name}</p>
                                                                        </div>
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        );
                                    })()}
                                </div>

                                <div className="fixed bottom-0 left-1/2 transform -translate-x-1/2 w-full max-w-[480px] bg-dark-900/95 backdrop-blur p-4 border-t border-white/5 z-20">
                                    <button onClick={() => { setIsTrainingStarted(true); setTrainingTime(0); setRestTime(0); unlockAudio(); }} className="w-full bg-brand-500 text-white font-black text-sm uppercase tracking-wider py-4 rounded-2xl flex items-center justify-center gap-2 hover:bg-brand-600 transition-all shadow-xl shadow-brand-500/30">
                                        <i className="fa-solid fa-play"></i> Empezar Entrenamiento
                                    </button>
                                </div>
                            </div>
                        ) : (
                            <div className="app-container pb-20 relative z-10">
                                <header className="p-4 flex items-center justify-between sticky top-0 glass-header z-20 shadow-md">
                                    <button onClick={() => showToast('Sesión en curso')} className="text-brand-500 text-xs font-black uppercase tracking-wider flex items-center gap-2 bg-dark-800 px-3.5 py-2 rounded-xl border border-white/5"><i className="fa-solid fa-stopwatch animate-pulse"></i> {formatTime(trainingTime)}</button>
                                    <button onClick={() => { setIsTrainingStarted(false); showToast(`¡Entrenamiento finalizado! Tiempo: ${formatTime(trainingTime)}`); setView('cliente_listado'); }} className="bg-dark-800 text-brand-500 px-4 py-2 rounded-xl text-xs font-black uppercase tracking-wider border border-white/5 hover:bg-dark-700 transition-colors">Terminar</button>
                                </header>

                                <div className="p-4 pt-6">
                                    {(() => {
                                        const day = globalData.routines[currentUser.id]?.find(d => d.id === activeDayId) || {};
                                        const sections = day.sections || [{ name: 'Bloque Principal', exercises: day.exercises || [] }];

                                        return (
                                            <div className="space-y-8">
                                                {sections.map((sec, sIdx) => (
                                                    <div key={sIdx}>
                                                        <h3 className="font-black text-xs text-brand-500 uppercase tracking-widest mb-3 border-b border-dark-700 pb-2 flex items-center gap-2">
                                                            <i className="fa-solid fa-layer-group"></i> {sec.name}
                                                        </h3>
                                                        <div className="space-y-6">
                                                            {sec.exercises?.map(ex => {
                                                                const safePreviousWeekData = activeWeek > 1 ? globalData.progress?.[currentUser.id]?.[activeWeek - 1]?.[ex.id] : null;
                                                                
                                                                return (
                                                                    <ClientExerciseRow 
                                                                        key={`${ex.id}-${activeWeek}`} 
                                                                        exercise={ex} 
                                                                        activeWeek={activeWeek}
                                                                        progressData={globalData.progress?.[currentUser.id]?.[activeWeek]?.[ex.id]} 
                                                                        previousWeekData={safePreviousWeekData}
                                                                        allWeeksData={globalData.progress?.[currentUser.id]}
                                                                        onSaveProgress={(setsArray, noteString) => saveClientProgress(ex.id, setsArray, noteString, activeWeek)} 
                                                                        onStartRest={startRest}
                                                                        showToast={showToast}
                                                                    />
                                                                )
                                                            })}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        );
                                    })()}
                                </div>

                                {/* Cronómetro Flotante */}
                                {restTime > 0 && (
                                    <div className="fixed bottom-16 left-1/2 transform -translate-x-1/2 bg-brand-500 text-white px-6 py-3 rounded-2xl font-black text-sm tracking-wider shadow-[0_0_25px_rgba(255,94,0,0.6)] flex items-center gap-3 z-50 animate-bounce cursor-pointer uppercase border border-white/20" onClick={() => setRestTime(0)}>
                                        <i className="fa-solid fa-stopwatch animate-pulse text-lg"></i>
                                        Descanso: {Math.floor(restTime/60)}:{(restTime%60).toString().padStart(2,'0')}
                                        <div className="ml-1 bg-black/20 hover:bg-black/40 transition-colors rounded-xl w-6 h-6 flex items-center justify-center text-xs"><i className="fa-solid fa-xmark"></i></div>
                                    </div>
                                )}
                            </div>
                        )
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
