        let audioCtx = null;
        const unlockAudio = () => {
            if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        };

        const playAlarm = () => {
            try {
                if (!audioCtx) unlockAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime); 
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.2); 
                gain.gain.setValueAtTime(1, audioCtx.currentTime); 
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.6); 
            } catch(e) {}
        };

        // --- MODAL DEL CATÁLOGO DE EJERCICIOS ---

                        <div className="flex gap-3 overflow-x-auto hide-scrollbar pb-1">
                            <button onClick={() => setMuscleFilter('')} className={`whitespace-nowrap px-4 py-2 rounded-xl text-sm font-semibold transition-colors ${muscleFilter === '' ? 'bg-white text-black' : 'bg-dark-800 text-gray-300 border border-white/5'}`}>Todos</button>

                                <button key={m} onClick={() => setMuscleFilter(m)} className={`whitespace-nowrap px-4 py-2 rounded-xl text-sm font-semibold transition-colors ${muscleFilter === m ? 'bg-white text-black' : 'bg-dark-800 text-gray-300 border border-white/5'}`}>

                    <div className="flex-1 overflow-y-auto px-4 py-2 hide-scrollbar">
                        <h3 className="text-white font-bold text-lg mb-4 mt-2">Ejercicios Alternativos</h3>
                        <div className="space-y-1">
                            {filteredExercises.map((ex, idx) => (
                                <div key={idx} onClick={() => onSelect(ex.name)} className="flex items-center justify-between py-3 cursor-pointer hover:bg-white/5 rounded-xl px-2 transition-colors group">
                                    <div className="flex items-center gap-4">
                                        <div className="w-12 h-12 rounded-full bg-white flex items-center justify-center shrink-0 shadow-md">
                                            <i className="fa-solid fa-dumbbell text-dark-900 text-xl"></i>
                                        </div>
                                        <div>
                                            <h4 className="text-white font-medium text-base leading-tight group-hover:text-brand-500 transition-colors">{ex.name}</h4>
                                            <p className="text-gray-400 text-sm mt-0.5">{ex.muscle}</p>
                                        </div>
                                    </div>
                                    <button className="text-gray-500 hover:text-white px-2"><i className="fa-regular fa-circle-info text-lg"></i></button>

        }

        function EditableTitle({ initialValue, placeholder, className, onSave }) {
            const inputRef = useRef(null);
            useEffect(() => { if (inputRef.current && inputRef.current.value !== initialValue) inputRef.current.value = initialValue || ''; }, [initialValue]);
            return ( <input ref={inputRef} type="text" defaultValue={initialValue || ''} placeholder={placeholder} className={className} onBlur={(e) => onSave(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') e.target.blur(); }} /> );
        }

        function ExerciseRow({ exercise, clientProgress, onUpdate, onDelete }) {
            const [localEx, setLocalEx] = useState(exercise);
            const [editWeek, setEditWeek] = useState(1); 

            useEffect(() => { setLocalEx(exercise); }, [exercise]);

            const handleChange = (field, value) => {
                const updated = { ...localEx, [field]: value };
                setLocalEx(updated);
            };

            const handleWeekConfigChange = (weekNum, field, value) => {
                const updatedWeeks = structuredClone(localEx.weeks || {});
                if (!updatedWeeks[weekNum]) updatedWeeks[weekNum] = { sets: localEx.sets || '4', reps: localEx.reps || '10' };
                updatedWeeks[weekNum][field] = value;
                const updated = { ...localEx, weeks: updatedWeeks };
                setLocalEx(updated);
                onUpdate(updated);
            };
            
            const handleBlur = () => { setTimeout(() => onUpdate(localEx), 100); };
            const currentWeekData = localEx.weeks?.[editWeek] || { sets: localEx.sets || '4', reps: localEx.reps || '10' };

            return (
                <div className="glass-panel p-4 rounded-2xl mb-4 relative z-10 shadow-xl border border-white/5">
                    <div className="flex justify-between items-start mb-3 relative">
                        <div className="w-5/6 relative">
                            <input className="bg-transparent font-bold text-lg outline-none w-full text-white placeholder-gray-500 tracking-wide" value={localEx.name} onChange={(e) => handleChange('name', e.target.value)} onBlur={handleBlur} placeholder="Nombre del ejercicio" />
                        </div>
                        <button onClick={onDelete} className="text-gray-500 hover:text-red-400 transition-colors px-2 py-1"><i className="fa-solid fa-trash-can"></i></button>
                    </div>

                    <div className="mb-3 pt-1">
                        <div className="flex items-center justify-between mb-2">
                            <span className="text-[10px] font-black text-brand-500 uppercase tracking-widest">Pauta:</span>
                            <div className="flex bg-dark-900 rounded-lg p-0.5 border border-dark-600">
                                {[1, 2, 3, 4].map(w => (
                                    <button key={w} type="button" onClick={() => setEditWeek(w)} className={`px-3 py-1 text-xs font-bold rounded-md transition-all ${editWeek === w ? 'bg-brand-500 text-white shadow-md' : 'text-gray-400 hover:text-white'}`}>S{w}</button>
                                ))}
                            </div>
                        </div>

                        <div className="flex gap-4 text-sm text-gray-300 items-center bg-dark-900/60 p-3 rounded-xl border border-dark-600">
                            <div className="flex items-center gap-2 flex-1"><span className="text-xs text-gray-400">Series:</span><input className="w-12 bg-dark-700 rounded-lg p-1.5 text-center text-white font-bold outline-none border border-dark-600 focus:border-brand-500" value={currentWeekData.sets} onChange={(e) => handleWeekConfigChange(editWeek, 'sets', e.target.value)} onBlur={handleBlur} /></div>
                            <div className="flex items-center gap-2 flex-1"><span className="text-xs text-gray-400">Reps:</span><input className="w-12 bg-dark-700 rounded-lg p-1.5 text-center text-white font-bold outline-none border border-dark-600 focus:border-brand-500" value={currentWeekData.reps} onChange={(e) => handleWeekConfigChange(editWeek, 'reps', e.target.value)} onBlur={handleBlur} /></div>
                        </div>
                    </div>

                    <div className="flex gap-4 text-sm text-gray-400 items-center py-1">
                        <div className="text-xs flex items-center gap-1.5">RIR <input className="w-10 bg-dark-900 rounded-lg p-1.5 text-center text-white font-bold outline-none border border-dark-600 focus:border-brand-500" value={localEx.rir || '2'} onChange={(e) => handleChange('rir', e.target.value)} onBlur={handleBlur} /></div>
                        <div className="flex items-center gap-1.5"><i className="fa-regular fa-clock text-brand-500"></i> <input className="w-14 bg-dark-900 rounded-lg p-1.5 text-center text-white font-bold outline-none border border-dark-600 focus:border-brand-500 text-xs" value={localEx.rest || '90s'} onChange={(e) => handleChange('rest', e.target.value)} onBlur={handleBlur} placeholder="90s" /></div>
                    </div>
                    
                    <div className="mt-3 pt-3 border-t border-dark-600 flex items-center gap-2.5">
                        <input type="checkbox" id={`uni-${localEx.id}`} checked={localEx.isUnilateral || false} onChange={(e) => {handleChange('isUnilateral', e.target.checked); handleBlur();}} className="w-4 h-4 accent-brand-500 rounded cursor-pointer" />
                        <label htmlFor={`uni-${localEx.id}`} className="text-xs text-gray-300 cursor-pointer font-medium">Ejercicio Unilateral</label>
                    </div>

                    <div className="mt-3">
                        <textarea className="w-full bg-dark-900/80 text-gray-200 p-3 rounded-xl outline-none border border-dark-600 focus:border-brand-500 text-sm resize-none box-border" rows="2" placeholder="Aclaraciones técnicas..." value={localEx.coachNote || ''} onChange={(e) => handleChange('coachNote', e.target.value)} onBlur={handleBlur}/>
                    </div>
                </div>
            );
        }

        function ClientExerciseRow({ exercise, activeWeek, progressData, previousWeekData, allWeeksData, onSaveProgress, onStartRest }) {
            const weekConfig = exercise.weeks?.[activeWeek] || { sets: exercise.sets || '4', reps: exercise.reps || '10' };
            const isUni = exercise.isUnilateral === true;
            const totalRows = isUni ? parseInt(weekConfig.sets) * 2 : parseInt(weekConfig.sets);

            const [localSets, setLocalSets] = useState(() => {
                const saved = progressData?.sets;
                if (saved && saved.length > 0) return saved;
                return Array.from({length: totalRows}, () => ({ weight: '', reps: '', rir: '', done: false, type: 'N' }));
            });

            useEffect(() => {
                const saved = progressData?.sets;
                setLocalSets(saved && saved.length > 0 ? saved : Array.from({length: totalRows}, () => ({ weight: '', reps: '', rir: '', done: false, type: 'N' })));
            }, [progressData, totalRows, activeWeek]);

            const handleSetBlur = (newSets) => onSaveProgress(newSets || localSets, '');
            const updateSetLocal = (index, field, value) => { const newSets = structuredClone(localSets); newSets[index][field] = value; setLocalSets(newSets); };
            const adjustWeight = (index, amount) => {
                let currentVal = parseFloat(localSets[index].weight);
                let newVal = isNaN(currentVal) ? (amount > 0 ? 2.5 : 0) : Math.max(0, currentVal + amount);
                const updatedSets = structuredClone(localSets);
                updatedSets[index].weight = newVal === 0 ? '' : newVal.toString();
                setLocalSets(updatedSets);
                handleSetBlur(updatedSets);
            };
            const toggleDone = (index) => {
                unlockAudio();
                const newSets = structuredClone(localSets);
                newSets[index].done = !newSets[index].done;
                setLocalSets(newSets);
                handleSetBlur(newSets);
                if (newSets[index].done) onStartRest(exercise.rest || '90s');
            };

            return (
                <div className="mb-10 relative z-10">
                    <div className="flex items-center gap-3 mb-4">
                        <div className="w-11 h-11 bg-dark-700 rounded-2xl flex items-center justify-center text-brand-500 shadow-lg border border-white/5"><i className="fa-solid fa-dumbbell text-lg"></i></div>
                        <div>
                            <h4 className="font-bold text-base text-white">{exercise.name}</h4>
                            <span className="text-xs text-brand-500 font-semibold">{weekConfig.sets}x{weekConfig.reps} (RIR {exercise.rir || '2'})</span>
                        </div>
                    </div>
                    {exercise.coachNote && <div className="bg-dark-800/90 border-l-4 border-brand-500 p-3 rounded-r-xl mb-4 text-xs text-gray-300">{exercise.coachNote}</div>}

                    <div className="grid grid-cols-[36px_55px_1fr_65px_45px_42px] gap-1 mb-2 text-[10px] text-gray-400 font-black uppercase tracking-widest text-center items-center">
                        <span>Set</span><span>Previa</span><span>KG (±2.5)</span><span>Reps</span><span>RIR</span><span></span>
                    </div>
                    
                    {localSets.map((set, i) => {
                        const prevSet = previousWeekData?.sets?.[i];
                        const prevText = prevSet?.weight && prevSet?.reps ? `${prevSet.weight}x${prevSet.reps}` : '-';
                        return (
                            <div key={i} className="grid grid-cols-[36px_55px_1fr_65px_45px_42px] gap-1 items-center mb-2.5">
                                <button className={`w-9 h-10 flex items-center justify-center rounded-xl font-black text-xs border bg-dark-800 text-gray-400 border-dark-600`}>{isUni ? (Math.floor(i/2)+1) + (i%2!==0?'D':'I') : i+1}</button>
                                <div className="text-center text-gray-500 text-xs font-semibold">{prevText}</div>
                                <div className="flex items-center bg-dark-800 rounded-xl border border-dark-600 shadow-inner overflow-hidden">
                                    <button type="button" onClick={() => adjustWeight(i, -2.5)} className="w-7 h-10 text-gray-400 font-bold hover:bg-dark-700">-</button>
                                    <input type="text" inputMode="decimal" className="w-full bg-transparent py-2.5 text-white text-center font-bold text-sm outline-none" placeholder="-" value={set.weight} onChange={(e) => updateSetLocal(i, 'weight', e.target.value)} onBlur={() => handleSetBlur()} />
                                    <button type="button" onClick={() => adjustWeight(i, 2.5)} className="w-7 h-10 text-gray-400 font-bold hover:bg-dark-700">+</button>
                                </div>
                                <input type="number" className="w-full bg-dark-800 rounded-xl py-2.5 text-white text-center font-bold text-sm border border-dark-600 outline-none" placeholder="-" value={set.reps} onChange={(e) => updateSetLocal(i, 'reps', e.target.value)} onBlur={() => handleSetBlur()} />
                                <input type="number" className="w-full bg-dark-800 rounded-xl py-2.5 text-brand-500 text-center font-bold text-sm border border-dark-600 outline-none" placeholder="RIR" value={set.rir} onChange={(e) => updateSetLocal(i, 'rir', e.target.value)} onBlur={() => handleSetBlur()} />
                                <button onClick={() => toggleDone(i)} className={`w-10 h-10 rounded-xl flex items-center justify-center transition-all ${set.done ? 'bg-brand-500 text-white font-bold' : 'bg-dark-800 text-gray-500 border border-dark-600'}`}><i className="fa-solid fa-check"></i></button>
                            </div>
                        )
                    })}
                </div>
            );
        }

        function App() {
            const [globalData, setGlobalData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('home'); 
            const [currentUser, setCurrentUser] = useState(null);
            const [pinInput, setPinInput] = useState('');
            const [activeClient, setActiveClient] = useState(null);
            const [activeDayId, setActiveDayId] = useState(null);
            const [activeWeek, setActiveWeek] = useState(1); 
            const [isTrainingStarted, setIsTrainingStarted] = useState(false);
            const [trainingTime, setTrainingTime] = useState(0);
            const [restTime, setRestTime] = useState(0); 
            const [catalogTarget, setCatalogTarget] = useState(null); // {clientId, dayId, secId}

            useEffect(() => {
                fetchData();
                const channel = supabase.channel('realtime_sync').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'bravo_state' }, (payload) => {
                    if(payload && payload.new) setGlobalData(payload.new.data);
                }).subscribe();
                return () => supabase.removeChannel(channel);
            }, []);

            useEffect(() => {
                let interval = null;
                if (view === 'cliente_entrenamiento' && isTrainingStarted) interval = setInterval(() => setTrainingTime(t => t + 1), 1000);
                else clearInterval(interval);
                return () => clearInterval(interval);
            }, [view, isTrainingStarted]);

            useEffect(() => {
                let restInterval = null;
                if (restTime > 0) {
                    restInterval = setInterval(() => {
                        setRestTime(t => {
                            if (t <= 1) { playAlarm(); return 0; }
                            return t - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(restInterval);
            }, [restTime]);

            const fetchData = async () => {
                try {
                    const { data } = await supabase.from('bravo_state').select('data').eq('id', 'main').single();
                    setGlobalData(data?.data || { profesorPin: '0000', clients: [], routines: {}, progress: {} });
                } catch (e) { setGlobalData({ profesorPin: '0000', clients: [], routines: {}, progress: {} }); }
                setLoading(false);
            };

            const saveData = async (newData) => {
                setGlobalData(newData);
                await supabase.from('bravo_state').update({ data: newData }).eq('id', 'main');
            };

            const handleLogin = () => {
                if (pinInput === globalData.profesorPin) setView('profesor');
                else {
                    const client = globalData.clients?.find(c => c.pin === pinInput);
                    if (client) { setCurrentUser(client); setView('cliente_listado'); }
                }
                setPinInput('');
            };

            // INSERCIÓN DE EJERCICIO DESDE CATÁLOGO
            const handleExerciseSelected = (exerciseName) => {
                if (!catalogTarget) return;
                const { clientId, dayId, secId } = catalogTarget;
                const newData = structuredClone(globalData);
                const day = newData.routines[clientId].find(d => d.id === dayId);
                const sec = day.sections.find(s => s.id === secId);
                
                sec.exercises.push({ 
                    id: Math.random().toString(36).substr(2, 9), 
                    name: exerciseName, 
                    sets: '4', reps: '10', rir: '2', rest: '90s', isUnilateral: false, weeks: {} 
                });
                
                saveData(newData);
                setCatalogTarget(null); // Cierra el modal
            };

            const updateExerciseInSection = (clientId, dayId, secId, updatedEx) => {
                const newData = structuredClone(globalData);
                const sec = newData.routines[clientId].find(d => d.id === dayId).sections.find(s => s.id === secId);
                sec.exercises[sec.exercises.findIndex(e => e.id === updatedEx.id)] = updatedEx;
                saveData(newData);
            };
            const deleteExerciseFromSection = (cId, dId, sId, eId) => {
                const newData = structuredClone(globalData);
                const sec = newData.routines[cId].find(d => d.id === dId).sections.find(s => s.id === sId);
                sec.exercises = sec.exercises.filter(e => e.id !== eId);
                saveData(newData);
            };

            if (loading) return <div className="app-container bg-dark-900"></div>;

            return (
                <div className="relative">
                    {/* Renderizamos el Catálogo por encima si está activo */}
                    {catalogTarget && (
                        <ExerciseCatalogModal 
                            onClose={() => setCatalogTarget(null)} 
                            onSelect={handleExerciseSelected} 
                        />
                    )}

                    {view === 'home' && (
                        <div className="app-container flex flex-col justify-center p-6 bg-dark-900 h-screen z-10">
                            <div className="glass-panel p-6 rounded-3xl shadow-2xl border border-white/5">
                                <input type="password" placeholder="PIN" className="w-full bg-dark-900 p-4 rounded-2xl text-center text-xl tracking-[0.4em] text-white border border-dark-600 focus:border-brand-500 font-bold mb-4" value={pinInput} onChange={(e) => setPinInput(e.target.value)} />
                                <button onClick={handleLogin} className="w-full bg-brand-500 text-white py-4 rounded-2xl font-black uppercase">Entrar</button>
                            </div>
                        </div>
                    )}

                    {view === 'profesor' && (
                        <div className="app-container pb-20 z-10">
                            {activeClient ? (
                                activeDayId && globalData.routines[activeClient.id]?.find(d => d.id === activeDayId) ? (
                                    <>
                                        <header className="p-4 flex items-center justify-between sticky top-0 glass-header z-50">
                                            <button onClick={() => setActiveDayId(null)} className="text-brand-500 bg-dark-800 p-2 rounded-xl border border-white/5"><i className="fa-solid fa-arrow-left"></i></button>
                                            <h2 className="font-bold text-white">Plantilla</h2>
                                            <div className="w-8"></div>
                                        </header>
                                        <div className="p-4">
                                            {(() => {
                                                const day = globalData.routines[activeClient.id].find(d => d.id === activeDayId);
                                                const sections = day.sections || [];
                                                return sections.map((sec, secIdx) => (
                                                    <div key={sec.id || secIdx} className="bg-dark-800/80 p-4 rounded-3xl border border-white/5 mb-6">
                                                        <h3 className="font-black text-brand-500 text-sm mb-4 uppercase">{sec.name}</h3>
                                                        {sec.exercises.map(ex => (
                                                            <ExerciseRow key={ex.id} exercise={ex} onUpdate={(u) => updateExerciseInSection(activeClient.id, activeDayId, sec.id, u)} onDelete={() => deleteExerciseFromSection(activeClient.id, activeDayId, sec.id, ex.id)} />
                                                        ))}
                                                        {/* AQUÍ SE ABRE EL CATÁLOGO */}
                                                        <button onClick={() => setCatalogTarget({clientId: activeClient.id, dayId: activeDayId, secId: sec.id})} className="w-full bg-dark-700 text-brand-500 font-bold py-3.5 rounded-2xl mt-2 text-xs uppercase border border-white/5 flex justify-center gap-2">
                                                            <i className="fa-solid fa-magnifying-glass"></i> Añadir desde catálogo
                                                        </button>
                                                    </div>
                                                ));
                                            })()}
                                        </div>
                                    </>
                                ) : (
                                    <div className="p-4">
                                        <header className="flex justify-between items-center mb-6">
                                            <button onClick={() => setActiveClient(null)} className="text-brand-500 bg-dark-800 p-2 rounded-xl"><i className="fa-solid fa-arrow-left"></i></button>
                                            <h2 className="font-bold text-white">{activeClient.name}</h2>
                                        </header>
                                        <div className="space-y-4">
                                            {(globalData.routines[activeClient.id] || []).map(day => (
                                                <div key={day.id} onClick={() => setActiveDayId(day.id)} className="glass-panel p-4 rounded-2xl flex items-center justify-between cursor-pointer border border-white/5">
                                                    <h4 className="font-bold text-white">{day.name}</h4>
                                                    <i className="fa-solid fa-chevron-right text-gray-500"></i>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )
                            ) : (
                                <div className="p-5 space-y-4">
                                    <h2 className="font-black text-xl text-white uppercase mb-6">Panel Profe</h2>
                                    {globalData.clients?.map(client => (
                                        <div key={client.id} onClick={() => setActiveClient(client)} className="glass-panel p-4 rounded-2xl flex justify-between items-center cursor-pointer border border-white/5">
                                            <p className="font-bold text-white">{client.name}</p>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {view === 'cliente_listado' && (
                        <div className="app-container p-5 relative z-10">
                            <div className="mb-6 bg-dark-800/60 p-4 rounded-2xl border border-white/5">
                                <h2 className="text-xl font-black text-white">Hola, {currentUser?.name}</h2>
                            </div>
                            <div className="space-y-4">
                                {(globalData.routines[currentUser.id] || []).map(day => (
                                    <div key={day.id} onClick={() => {setActiveDayId(day.id); setIsTrainingStarted(false); setView('cliente_entrenamiento');}} className="glass-panel p-4 rounded-2xl flex items-center justify-between border border-white/5">
                                        <h4 className="font-bold text-white">{day.name}</h4>
                                        <i className="fa-solid fa-play text-brand-500"></i>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {view === 'cliente_entrenamiento' && isTrainingStarted && (
                        <div className="app-container p-4 pt-6 pb-20 relative z-10">
                            {(() => {
                                const day = globalData.routines[currentUser.id]?.find(d => d.id === activeDayId) || {};
                                return (day.sections || []).map((sec, sIdx) => (
                                    <div key={sIdx}>
                                        <h3 className="font-black text-brand-500 uppercase mb-3">{sec.name}</h3>
                                        {sec.exercises?.map(ex => (
                                            <ClientExerciseRow key={ex.id} exercise={ex} activeWeek={activeWeek} progressData={globalData.progress?.[currentUser.id]?.[activeWeek]?.[ex.id]} onSaveProgress={(sets) => {}} onStartRest={startRest} />
                                        ))}
                                    </div>
                                ));
                            })()}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
