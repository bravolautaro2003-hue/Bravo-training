<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bravo Training</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Enlaces de motor cambiados a jsDelivr con permisos de seguridad para evitar bloqueos en celulares -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.22.13/babel.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.33.1/dist/umd/supabase.min.js" crossorigin="anonymous"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#ef4444', 600: '#dc2626' }, // Rojo Bravo
                        dark: { 900: '#0a0a0a', 800: '#171717', 700: '#262626' }
                    }
                }
            }
        }
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; background-color: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .app-container { max-width: 480px; margin: 0 auto; min-height: 100vh; background-color: #0a0a0a; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased">
    <div id="root">
        <div style="padding: 30px; text-align: center; margin-top: 30%;">
            <i class="fa-solid fa-dumbbell" style="font-size: 3rem; color: #ef4444; margin-bottom: 20px;"></i>
            <h2 style="font-size: 1.5rem; font-weight: bold;">Cargando plataforma...</h2>
        </div>
    </div>

    <!-- Capturador de errores avanzado -->
    <script>
        window.addEventListener('error', function(e) {
            const root = document.getElementById('root');
            if(root) root.innerHTML = '<div style="background:#7f1d1d; color:white; padding:20px; margin:20px; border-radius:10px;"><b>Fallo de conexión:</b><br>' + (e.message || 'Script bloqueado por el navegador') + '<br><br>Intenta abrir en modo incógnito o revisa tu conexión.</div>';
        }, true);
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const SUPABASE_URL = 'https://pncnnvbdquzyvcnuethx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_5WHz-KSuu5BaV08EGXJJmg_dkVOUJwy';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- COMPONENTE: EDICIÓN DE EJERCICIO (PROFESOR) ---
        function ExerciseRow({ exercise, onUpdate, onDelete }) {
            const [localEx, setLocalEx] = useState(exercise);
            const handleChange = (field, value) => setLocalEx(prev => ({ ...prev, [field]: value }));
            const handleBlur = () => onUpdate(localEx);

            return (
                <div className="bg-dark-800 p-4 rounded-2xl border border-dark-700 mb-4 shadow-sm">
                    <div className="flex justify-between items-start mb-3">
                        <input className="bg-transparent font-bold text-lg outline-none w-2/3 text-white placeholder-gray-500" value={localEx.name} onChange={(e) => handleChange('name', e.target.value)} onBlur={handleBlur} placeholder="Nombre del ejercicio" />
                        <button onClick={onDelete} className="bg-dark-700 text-brand-500 p-2 rounded-lg text-sm"><i className="fa-solid fa-xmark"></i></button>
                    </div>
                    <div className="flex gap-2 text-sm text-gray-400 items-center">
                        <input className="w-12 bg-transparent outline-none border-b border-dark-700 text-center text-white focus:border-brand-500" value={localEx.sets} onChange={(e) => handleChange('sets', e.target.value)} onBlur={handleBlur} /> series
                        <input className="w-16 bg-transparent outline-none border-b border-dark-700 text-center text-white ml-2 focus:border-brand-500" value={localEx.reps} onChange={(e) => handleChange('reps', e.target.value)} onBlur={handleBlur} /> reps
                        <span className="ml-2">RIR</span><input className="w-8 bg-transparent outline-none border-b border-dark-700 text-center text-white focus:border-brand-500" value={localEx.rir} onChange={(e) => handleChange('rir', e.target.value)} onBlur={handleBlur} />
                    </div>
                </div>
            );
        }

        // --- COMPONENTE: EJECUCIÓN DE EJERCICIO (ALUMNO) ---
        function ClientExerciseRow({ exercise, progressData, onSaveProgress }) {
            const setsCount = parseInt(exercise.sets) || 1;
            const [localSets, setLocalSets] = useState(() => {
                const saved = progressData?.sets || [];
                return Array.from({length: setsCount}, (_, i) => ({
                    weight: saved[i]?.weight || '', 
                    reps: saved[i]?.reps || '',
                    done: saved[i]?.done || false
                }));
            });

            const updateSet = (index, field, value) => {
                const newSets = [...localSets];
                newSets[index][field] = value;
                setLocalSets(newSets);
                onSaveProgress(newSets);
            };

            return (
                <div className="bg-dark-800 p-5 rounded-2xl mb-4 border border-dark-700">
                    <h4 className="font-bold text-xl text-white mb-2">{exercise.name}</h4>
                    <p className="text-sm text-gray-400 mb-4">
                        Meta <strong className="text-white">{exercise.reps} reps</strong> &nbsp;&nbsp; RIR <strong className="text-white">{exercise.rir}</strong>
                    </p>
                    
                    <div className="grid grid-cols-[auto_1fr_1fr_auto] gap-3 mb-2 text-xs text-gray-500 font-bold uppercase tracking-wider">
                        <span>Tipo</span><span className="text-center">KG</span><span className="text-center">Reps</span><span></span>
                    </div>
                    
                    {localSets.map((set, i) => (
                        <div key={i} className={`grid grid-cols-[auto_1fr_1fr_auto] gap-3 items-center mb-2 p-2 rounded-lg ${set.done ? 'bg-brand-500/10 border border-brand-500/20' : 'bg-dark-700/50'}`}>
                            <span className="w-6 h-6 flex items-center justify-center bg-dark-900 rounded font-bold text-xs">{i + 1}</span>
                            <div className="relative">
                                <input type="number" className="w-full bg-dark-900 rounded-lg p-2 text-white outline-none text-center" placeholder="-" value={set.weight} onChange={(e) => updateSet(i, 'weight', e.target.value)} />
                            </div>
                            <div className="relative">
                                <input type="number" className="w-full bg-dark-900 rounded-lg p-2 text-white outline-none text-center" placeholder="-" value={set.reps} onChange={(e) => updateSet(i, 'reps', e.target.value)} />
                            </div>
                            <button onClick={() => updateSet(i, 'done', !set.done)} className={`w-8 h-8 rounded-lg flex items-center justify-center transition-colors ${set.done ? 'bg-brand-500 text-white' : 'bg-dark-900 border border-dark-600 text-dark-600'}`}>
                                <i className="fa-solid fa-check"></i>
                            </button>
                        </div>
                    ))}
                    <button className="mt-3 text-sm text-gray-400 font-bold flex items-center gap-2 px-2 py-1 rounded hover:bg-dark-700">
                        <i className="fa-solid fa-plus"></i> Añadir serie
                    </button>
                </div>
            );
        }

        function App() {
            const [globalData, setGlobalData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('home'); 
            const [currentUser, setCurrentUser] = useState(null);
            const [pinInput, setPinInput] = useState('');
            const [newClientName, setNewClientName] = useState('');
            const [activeClient, setActiveClient] = useState(null);
            const [activeDayId, setActiveDayId] = useState(null);

            useEffect(() => {
                fetchData();
                const channel = supabase.channel('realtime_sync').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'bravo_state' }, (payload) => {
                    if(payload && payload.new) setGlobalData(payload.new.data);
                }).subscribe();
                return () => { supabase.removeChannel(channel); };
            }, []);

            const fetchData = async () => {
                try {
                    const { data, error } = await supabase.from('bravo_state').select('data').eq('id', 'main').single();
                    if (error) throw error;
                    if (data) setGlobalData(data.data);
                } catch (e) {
                    console.error("Error BD:", e.message);
                }
                setLoading(false);
            };

            const saveData = async (newData) => {
                setGlobalData(newData);
                await supabase.from('bravo_state').update({ data: newData }).eq('id', 'main');
            };

            const handleLogin = () => {
                if (!globalData) {
                    alert("No se detectó la base de datos. Avisale al profe.");
                    return;
                }
                if (pinInput === globalData.profesorPin) { setView('profesor'); } 
                else {
                    const client = globalData.clients?.find(c => c.pin === pinInput);
                    if (client) { 
                        setCurrentUser(client); 
                        if(globalData.routines[client.id]?.length > 0) setActiveDayId(globalData.routines[client.id][0].id);
                        setView('cliente'); 
                    } else { alert('PIN incorrecto. Revisalo bien.'); }
                }
                setPinInput('');
            };

            // FUNCIONES PROFESOR
            const addClient = () => {
                if (!newClientName.trim()) return;
                const newData = JSON.parse(JSON.stringify(globalData));
                const newClient = { id: Date.now().toString(), name: newClientName, pin: Math.floor(1000 + Math.random() * 9000).toString() };
                if(!newData.clients) newData.clients = [];
                if(!newData.routines) newData.routines = {};
                if(!newData.progress) newData.progress = {};
                newData.clients.push(newClient);
                newData.routines[newClient.id] = [];
                saveData(newData);
                setNewClientName('');
            };

            const addDay = (clientId) => {
                const newData = JSON.parse(JSON.stringify(globalData));
                const newId = Date.now().toString();
                newData.routines[clientId].push({ id: newId, name: "Día " + (newData.routines[clientId].length + 1), exercises: [] });
                saveData(newData);
                setActiveDayId(newId);
            };

            const addExercise = (clientId, dayId) => {
                const newData = JSON.parse(JSON.stringify(globalData));
                const day = newData.routines[clientId].find(d => d.id === dayId);
                day.exercises.push({ id: Date.now().toString(), name: 'Nuevo Ejercicio', sets: '3', reps: '10', rir: '2' });
                saveData(newData);
            };

            const updateExercise = (clientId, dayId, updatedExercise) => {
                const newData = JSON.parse(JSON.stringify(globalData));
                const day = newData.routines[clientId].find(d => d.id === dayId);
                const index = day.exercises.findIndex(e => e.id === updatedExercise.id);
                day.exercises[index] = updatedExercise;
                saveData(newData);
            };

            const deleteExercise = (clientId, dayId, exerciseId) => {
                const newData = JSON.parse(JSON.stringify(globalData));
                const day = newData.routines[clientId].find(d => d.id === dayId);
                day.exercises = day.exercises.filter(e => e.id !== exerciseId);
                saveData(newData);
            };

            // FUNCIONES ALUMNO
            const saveClientProgress = (exerciseId, setsArray) => {
                const newData = JSON.parse(JSON.stringify(globalData));
                if (!newData.progress[currentUser.id]) newData.progress[currentUser.id] = {};
                if (!newData.progress[currentUser.id][exerciseId]) newData.progress[currentUser.id][exerciseId] = {};
                newData.progress[currentUser.id][exerciseId].sets = setsArray;
                saveData(newData);
            };

            if (loading) return <div className="app-container flex justify-center items-center"><i className="fa-solid fa-spinner fa-spin text-brand-500 text-4xl"></i></div>;

            // --- PANTALLA LOGIN ---
            if (view === 'home') return (
                <div className="app-container flex flex-col justify-center p-6 space-y-8">
                    <div className="text-center space-y-2">
                        <i className="fa-solid fa-dumbbell text-5xl text-brand-500 mb-2"></i>
                        <h1 className="text-4xl font-black tracking-tighter uppercase">Bravo <span className="text-brand-500">Training</span></h1>
                    </div>
                    <div className="bg-dark-800 p-6 rounded-3xl border border-dark-700">
                        <input type="password" placeholder="PIN" className="w-full bg-dark-900 border border-dark-600 p-4 rounded-xl text-center text-2xl tracking-[0.5em] focus:border-brand-500 outline-none mb-4" value={pinInput} onChange={(e) => setPinInput(e.target.value)} />
                        <button onClick={handleLogin} className="w-full bg-brand-600 py-4 rounded-xl font-bold text-lg shadow-lg shadow-brand-500/20">Ingresar</button>
                    </div>
                </div>
            );

            // --- PANTALLA PROFESOR ---
            if (view === 'profesor') {
                if(activeClient) {
                    const clientRoutines = globalData.routines[activeClient.id] || [];
                    const currentDay = clientRoutines.find(d => d.id === activeDayId) || clientRoutines[0];

                    return (
                        <div className="app-container flex flex-col pb-20">
                            <header className="p-4 flex items-center justify-between border-b border-dark-800 bg-dark-900 sticky top-0 z-10">
                                <button onClick={() => {setActiveClient(null); setActiveDayId(null);}} className="text-gray-400 w-8 h-8 flex items-center justify-center bg-dark-800 rounded-full"><i className="fa-solid fa-arrow-left"></i></button>
                                <h2 className="font-bold text-xl">{activeClient.name}</h2>
                                <span className="bg-dark-800 text-xs px-2 py-1 rounded text-gray-400 font-mono">PIN {activeClient.pin}</span>
                            </header>

                            <div className="p-4 space-y-6">
                                <div className="flex gap-2">
                                    <button className="bg-brand-500 text-white px-5 py-2 rounded-full font-bold text-sm">Rutina</button>
                                    <button className="bg-dark-800 text-gray-400 px-5 py-2 rounded-full font-bold text-sm">Mesociclos</button>
                                </div>

                                <div className="flex gap-2 overflow-x-auto hide-scrollbar">
                                    {clientRoutines.map(day => (
                                        <button key={day.id} onClick={() => setActiveDayId(day.id)} className={`whitespace-nowrap px-5 py-2 rounded-full font-bold text-sm ${activeDayId === day.id ? 'bg-brand-500 text-white' : 'bg-dark-800 text-gray-400'}`}>{day.name}</button>
                                    ))}
                                    <button onClick={() => addDay(activeClient.id)} className="whitespace-nowrap bg-dark-800 text-gray-400 px-4 py-2 rounded-full font-bold text-sm border border-dark-700">+ Día</button>
                                </div>

                                {currentDay && (
                                    <div className="bg-dark-900 border border-dark-800 rounded-3xl p-4">
                                        <div className="flex justify-between items-center mb-6 border-b border-dark-700 pb-2">
                                            <input className="font-bold text-xl bg-transparent outline-none text-white w-2/3" value={currentDay.name} onChange={(e) => {
                                                const newData = JSON.parse(JSON.stringify(globalData));
                                                newData.routines[activeClient.id].find(d => d.id === currentDay.id).name = e.target.value;
                                                saveData(newData);
                                            }}/>
                                            <button className="text-brand-500 text-sm font-bold bg-brand-500/10 px-3 py-1 rounded-lg">Borrar</button>
                                        </div>

                                        {currentDay.exercises.map(ex => (
                                            <ExerciseRow key={ex.id} exercise={ex} onUpdate={(u) => updateExercise(activeClient.id, currentDay.id, u)} onDelete={() => deleteExercise(activeClient.id, currentDay.id, ex.id)} />
                                        ))}

                                        <button onClick={() => addExercise(activeClient.id, currentDay.id)} className="w-full bg-dark-800 py-4 rounded-xl font-bold text-sm mt-2 border border-dark-700 text-gray-300 hover:text-white"><i className="fa-solid fa-plus mr-2"></i> Agregar ejercicio</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="app-container flex flex-col">
                        <header className="p-5 flex justify-between items-center border-b border-dark-800 bg-dark-900 sticky top-0">
                            <h2 className="font-bold text-xl text-brand-500"><i className="fa-solid fa-user-gear"></i> Panel de Control</h2>
                            <button onClick={() => setView('home')} className="text-gray-400 w-8 h-8 bg-dark-800 rounded-full flex items-center justify-center"><i className="fa-solid fa-arrow-right-from-bracket"></i></button>
                        </header>
                        <div className="p-5 space-y-6">
                            <div className="flex gap-2 bg-dark-800 p-2 rounded-2xl border border-dark-700 shadow-inner">
                                <input className="flex-1 bg-transparent px-4 outline-none text-sm text-white" placeholder="Nombre del alumno..." value={newClientName} onChange={(e) => setNewClientName(e.target.value)} />
                                <button onClick={addClient} className="bg-brand-600 rounded-xl w-10 h-10 flex items-center justify-center text-white"><i className="fa-solid fa-plus"></i></button>
                            </div>
                            
                            <div className="space-y-3">
                                {globalData.clients?.map(client => (
                                    <div key={client.id} onClick={() => { setActiveClient(client); if(globalData.routines[client.id]?.[0]) setActiveDayId(globalData.routines[client.id][0].id); }} className="bg-dark-800 p-4 rounded-2xl flex justify-between items-center cursor-pointer border border-dark-700 hover:border-brand-500 transition-colors">
                                        <div>
                                            <p className="font-bold text-lg text-white">{client.name}</p>
                                            <p className="text-xs text-brand-500 mt-1">PIN: {client.pin}</p>
                                        </div>
                                        <i className="fa-solid fa-chevron-right text-gray-600"></i>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            // --- PANTALLA ALUMNO ---
            if (view === 'cliente') {
                const clientRoutines = globalData.routines[currentUser.id] || [];
                const currentDay = clientRoutines.find(d => d.id === activeDayId) || clientRoutines[0];

                return (
                    <div className="app-container flex flex-col pb-20">
                        <header className="p-5 flex justify-between items-center bg-dark-900 sticky top-0 z-10 border-b border-dark-800">
                            <div>
                                <h1 className="text-2xl font-bold">Hola, <span className="text-white">{currentUser.name}</span></h1>
                                <p className="text-gray-400 text-sm">Tu rutina</p>
                            </div>
                            <button onClick={() => setView('home')} className="bg-dark-800 text-gray-300 px-4 py-2 rounded-xl text-sm border border-dark-700">Salir</button>
                        </header>

                        <div className="p-5 space-y-6">
                            <div className="bg-dark-800 p-4 rounded-2xl flex justify-between items-center border border-dark-700">
                                <div><h3 className="font-bold text-lg text-white">Entrenamiento</h3><p className="text-brand-500 text-sm"><i className="fa-solid fa-fire"></i> Enfoque principal</p></div>
                                <span className="bg-dark-700 text-xs px-3 py-1 rounded-full text-gray-300 font-bold border border-dark-600">Semana 1</span>
                            </div>

                            <div className="flex justify-between items-center">
                                <span className="bg-dark-800 text-gray-300 px-4 py-2 rounded-full text-sm flex items-center gap-2 border border-dark-700"><i className="fa-regular fa-clock text-brand-500"></i> 00:00</span>
                                <button className="bg-brand-500 text-white px-6 py-2 rounded-full font-bold text-sm shadow-lg shadow-brand-500/20">Terminar</button>
                            </div>

                            <div className="flex gap-2">
                                <button className="bg-brand-500 text-white px-5 py-2 rounded-full font-bold text-sm shadow-md shadow-brand-500/20">Rutina</button>
                                <button className="bg-dark-800 text-gray-400 px-5 py-2 rounded-full font-bold text-sm border border-dark-700">Progreso</button>
                            </div>

                            {clientRoutines.length > 0 && (
                                <div className="flex gap-2 overflow-x-auto hide-scrollbar pb-2">
                                    {clientRoutines.map(day => (
                                        <button key={day.id} onClick={() => setActiveDayId(day.id)} className={`whitespace-nowrap px-5 py-2 rounded-full font-bold text-sm transition-colors ${activeDayId === day.id ? 'bg-brand-500 text-white shadow-md shadow-brand-500/20' : 'bg-dark-800 text-gray-400 border border-dark-700'}`}>{day.name}</button>
                                    ))}
                                </div>
                            )}

                            <div>
                                {currentDay?.exercises.map(ex => (
                                    <ClientExerciseRow key={ex.id} exercise={ex} progressData={globalData.progress?.[currentUser.id]?.[ex.id]} onSaveProgress={(setsArray) => saveClientProgress(ex.id, setsArray)} />
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
