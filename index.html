<body class="antialiased">
    <div id="root"></div>

    <script type="text/babel">
        if ('serviceWorker' in navigator) {
            const swCode = "self.addEventListener('fetch', function(e) {});";
            const blob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
        }

        const { useState, useEffect, useRef } = React;
        const SUPABASE_URL = 'https://pncnnvbdquzyvcnuethx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_5WHz-KSuu5BaV08EGXJJmg_dkVOUJwy';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- MÉTODOS DE ENTRENAMIENTO PREDEFINIDOS (PERIODIZACIÓN) ---
        const TRAINING_METHODS = {
            'hipertrofia_lineal': {
                name: '📈 Hipertrofia Lineal (Doble Progresión)',
                weeks: {
                    1: { sets: '4', reps: '8' },
                    2: { sets: '4', reps: '8' },
                    3: { sets: '4', reps: '10' },
                    4: { sets: '3', reps: '10' } // Deload / Descarga
                }
            },
            'fuerza_onda': {
                name: '⚡ Fuerza / Onda de Cargas (5x5 -> 5x3)',
                weeks: {
                    1: { sets: '5', reps: '5' },
                    2: { sets: '5', reps: '4' },
                    3: { sets: '5', reps: '3' },
                    4: { sets: '3', reps: '5' } // Deload
                }
            },
            'volumen_acumulacion': {
                name: '🔥 Volumen / Acumulación (Alta Repetición)',
                weeks: {
                    1: { sets: '3', reps: '12' },
                    2: { sets: '4', reps: '12' },
                    3: { sets: '4', reps: '15' },
                    4: { sets: '3', reps: '12' } // Deload
                }
            },
            'intensidad_baja_serie': {
                name: '🎯 Intensificación (Pocas series, alta carga)',
                weeks: {
                    1: { sets: '3', reps: '6' },
                    2: { sets: '3', reps: '5' },
                    3: { sets: '3', reps: '4' },
                    4: { sets: '2', reps: '6' } // Deload
                }
            }
        };

        const EXERCISE_DB = [
            "Sentadilla Libre (Barra)", "Sentadilla Búlgara", "Sentadilla Hack", "Prensa de Piernas",
            "Peso Muerto Rumano", "Peso Muerto Convencional", "Hip Thrust", "Extensión de Cuádriceps",
            "Curl Femoral (Sentado)", "Curl Femoral (Tumbado)", "Elevación de Talones",
            "Press de Banca Plano", "Press de Banca Inclinado", "Aperturas con Mancuernas", "Cruce de Poleas",
            "Jalón al Pecho", "Remo con Barra", "Remo Gironda", "Remo en Máquina", "Dominadas",
            "Press Militar", "Elevaciones Laterales", "Pájaros (Hombro Posterior)",
            "Curl de Bíceps (Mancuernas)", "Curl de Bíceps (Barra Z)", "Curl Martillo",
            "Extensión de Tríceps (Polea)", "Press Francés", "Fondos en Paralelas",
            "Crunch Abdominal", "Plancha Isométrica", "Elevación de Piernas Colgado",
            "Aducción de Cadera (Máquina)", "Abducción de Cadera (Máquina)"
        ];

        let audioCtx = null;
        const unlockAudio = () => {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        };

        document.addEventListener('touchstart', unlockAudio, { once: true });
        document.addEventListener('click', unlockAudio, { once: true });

        const playAlarm = () => {
            try {
                if (!audioCtx) unlockAudio();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); 
                oscillator.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.2); 
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime); 
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.6); 
            } catch(e) { console.log("Audio falló", e); }
        };

        // --- COMPONENTE: EDICIÓN DE EJERCICIO (PROFESOR) ---
        function ExerciseRow({ exercise, onUpdate, onDelete }) {
            const [localEx, setLocalEx] = useState(exercise);
            const [showSuggestions, setShowSuggestions] = useState(false);

            const handleChange = (field, value) => {
                setLocalEx(prev => ({ ...prev, [field]: value }));
                if(field === 'name') setShowSuggestions(true);
            };

            // Al cambiar el método, autocompletemos las 4 semanas predeterminadas
            const handleMethodChange = (methodKey) => {
                const selectedMethod = TRAINING_METHODS[methodKey];
                if (!selectedMethod) return;

                const updated = {
                    ...localEx,
                    method: methodKey,
                    weeks: JSON.parse(JSON.stringify(selectedMethod.weeks))
                };
                setLocalEx(updated);
                onUpdate(updated);
            };
            
            const handleBlur = () => {
                setTimeout(() => {
                    setShowSuggestions(false);
                    onUpdate(localEx);
                }, 200);
            };

            const selectSuggestion = (name) => {
                const updated = { ...localEx, name };
                setLocalEx(updated);
                setShowSuggestions(false);
                onUpdate(updated);
            };

            const suggestions = EXERCISE_DB.filter(ex => 
                ex.toLowerCase().includes((localEx.name || '').toLowerCase()) && 
                localEx.name !== ex
            ).slice(0, 5);

            const currentMethod = localEx.method || 'hipertrofia_lineal';

            return (
                <div className="bg-dark-700 p-4 rounded-xl mb-4 border border-dark-600">
                    <div className="flex justify-between items-start mb-2 relative">
                        <div className="w-5/6 relative">
                            <input 
                                className="bg-transparent font-bold text-lg outline-none w-full text-white placeholder-gray-500" 
                                value={localEx.name} 
                                onChange={(e) => handleChange('name', e.target.value)} 
                                onBlur={handleBlur} 
                                onFocus={() => setShowSuggestions(true)}
                                placeholder="Nombre del ejercicio" 
                            />
                            {showSuggestions && localEx.name && suggestions.length > 0 && (
                                <div className="absolute z-50 top-full left-0 w-full mt-1 bg-dark-800 border border-dark-600 rounded-lg shadow-xl overflow-hidden">
                                    {suggestions.map((sug, idx) => (
                                        <div 
                                            key={idx} 
                                            onClick={() => selectSuggestion(sug)}
                                            className="px-4 py-3 text-sm text-gray-300 hover:bg-brand-500 hover:text-black cursor-pointer border-b border-dark-700 last:border-0 transition-colors"
                                        >
                                            {sug}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                        <button onClick={onDelete} className="text-gray-500 hover:text-red-500 transition-colors px-2 py-1"><i className="fa-solid fa-trash-can"></i></button>
                    </div>

                    {/* Selector de Método Predeterminado */}
                    <div className="mb-3 pt-2">
                        <label className="text-[11px] font-bold text-gray-400 uppercase tracking-wider block mb-1">Método de Progresión (Mesociclo Automático):</label>
                        <select 
                            value={currentMethod} 
                            onChange={(e) => handleMethodChange(e.target.value)}
                            className="w-full bg-dark-800 border border-dark-600 text-white text-xs font-semibold rounded-xl p-2.5 outline-none focus:border-brand-500 transition-colors"
                        >
                            {Object.entries(TRAINING_METHODS).map(([key, val]) => (
                                <option key={key} value={key}>{val.name}</option>
                            ))}
                        </select>
                    </div>

                    {/* Resumen visual de cómo impacta el método en las semanas */}
                    <div className="grid grid-cols-4 gap-1.5 mb-3 bg-dark-800 p-2 rounded-xl border border-dark-600 text-center">
                        {[1, 2, 3, 4].map(w => {
                            const wData = localEx.weeks?.[w] || TRAINING_METHODS[currentMethod]?.weeks[w] || {sets: '4', reps: '10'};
                            return (
                                <div key={w} className="bg-dark-700 p-1 rounded-lg">
                                    <span className="text-[10px] text-gray-400 block font-bold">Semana {w}</span>
                                    <span className="text-xs text-brand-500 font-black">{wData.sets}x{wData.reps}</span>
                                </div>
                            );
                        })}
                    </div>

                    <div className="flex gap-4 text-sm text-gray-400 items-center overflow-x-auto hide-scrollbar pb-1">
                        <div className="text-xs flex items-center gap-1">
                            RIR <input className="w-8 bg-dark-600 rounded p-1 text-center text-white outline-none focus:border focus:border-brand-500" value={localEx.rir || '2'} onChange={(e) => handleChange('rir', e.target.value)} onBlur={handleBlur} />
                        </div>
                        <div className="flex items-center gap-1">
                            <i className="fa-regular fa-clock"></i> <input className="w-12 bg-dark-600 rounded p-1 text-center text-white outline-none focus:border focus:border-brand-500" value={localEx.rest || '90s'} onChange={(e) => handleChange('rest', e.target.value)} onBlur={handleBlur} placeholder="90s" />
                        </div>
                    </div>
                    <div className="mt-4 pt-3 border-t border-dark-600 flex items-center gap-2">
                        <input type="checkbox" id={`uni-${localEx.id}`} checked={localEx.isUnilateral || false} onChange={(e) => {handleChange('isUnilateral', e.target.checked); handleBlur();}} className="w-4 h-4 accent-brand-500 rounded cursor-pointer" />
                        <label htmlFor={`uni-${localEx.id}`} className="text-xs text-gray-400 cursor-pointer select-none">Ejercicio Unilateral (Separar Izq/Der)</label>
                    </div>
                </div>
            );
        }

        // --- COMPONENTE: EJECUCIÓN DE EJERCICIO (ALUMNO) ---
        function ClientExerciseRow({ exercise, activeWeek, progressData, previousWeekData, allWeeksData, onSaveProgress, onStartRest, showToast }) {
            // Resolver las series y reps de la semana según el método predeterminado del ejercicio
            const methodKey = exercise.method || 'hipertrofia_lineal';
            const defaultWeekConfig = TRAINING_METHODS[methodKey]?.weeks[activeWeek] || { sets: '4', reps: '10' };
            const weekConfig = exercise.weeks?.[activeWeek] || defaultWeekConfig;

            const baseSetsCount = parseInt(weekConfig.sets) || 1;
            const isUni = exercise.isUnilateral === true;
            const totalRows = isUni ? baseSetsCount * 2 : baseSetsCount;

            const [showNotes, setShowNotes] = useState(false);
            const [showHistory, setShowHistory] = useState(false);
            const [localNote, setLocalNote] = useState(progressData?.note || '');

            const [localSets, setLocalSets] = useState(() => {
                const saved = progressData?.sets;
                if (saved && saved.length > 0) return saved;
                return Array.from({length: totalRows}, () => ({ weight: '', reps: '', done: false, type: 'N' }));
            });

            useEffect(() => {
                const saved = progressData?.sets;
                if (saved && saved.length > 0) {
                    setLocalSets(saved);
                } else {
                    setLocalSets(Array.from({length: totalRows}, () => ({ weight: '', reps: '', done: false, type: 'N' })));
                }
                setLocalNote(progressData?.note || '');
            }, [progressData, totalRows, activeWeek]);

            const updateSet = (index, field, value) => {
                if(field === 'done') unlockAudio();
                const newSets = [...localSets];
                const wasDone = newSets[index].done;
                newSets[index][field] = value;
                setLocalSets(newSets);
                onSaveProgress(newSets, localNote);
                
                if (field === 'done' && value === true && !wasDone) {
                    onStartRest(exercise.rest || '90s');
                }
            };

            const handleNoteChange = (e) => {
                const newNote = e.target.value;
                setLocalNote(newNote);
                onSaveProgress(localSets, newNote);
            };

            const addSet = () => {
                const addCount = isUni ? 2 : 1;
                const newSets = [...localSets];
                for(let i=0; i<addCount; i++){
                    newSets.push({ weight: '', reps: '', done: false, type: 'N' });
                }
                setLocalSets(newSets);
                onSaveProgress(newSets, localNote);
            };

            const cycleSetType = (index) => {
                const types = ['N', 'W', 'D'];
                const current = localSets[index].type || 'N';
                const next = types[(types.indexOf(current) + 1) % types.length];
                updateSet(index, 'type', next);
            };

            return (
                <div className="mb-10">
                    <div className="flex items-center justify-between mb-4">
                        <div className="flex items-center gap-4">
                            <div className="w-12 h-12 bg-dark-700 rounded-lg flex items-center justify-center text-brand-500 shadow-sm border border-dark-600">
                                <i className="fa-solid fa-dumbbell text-xl"></i>
                            </div>
                            <div>
                                <h4 className="font-bold text-lg text-white leading-tight">{exercise.name}</h4>
                                <span className="text-xs text-brand-500 font-semibold">Semana {activeWeek}: {weekConfig.sets} series x {weekConfig.reps} reps</span>
                            </div>
                        </div>
                    </div>

                    <div className="flex gap-2 mb-4 overflow-x-auto hide-scrollbar">
                        <button onClick={() => {setShowHistory(!showHistory); setShowNotes(false);}} className={`text-sm font-bold px-4 py-2 rounded-full flex items-center gap-2 transition-colors border ${showHistory ? 'bg-brand-500 text-black border-brand-500' : 'bg-dark-700 text-white border-dark-600 hover:bg-dark-600'}`}>
                            <i className="fa-solid fa-clock-rotate-left"></i> Historial
                        </button>
                        <button onClick={() => {setShowNotes(!showNotes); setShowHistory(false);}} className={`text-sm font-bold px-4 py-2 rounded-full flex items-center gap-2 transition-colors border ${showNotes ? 'bg-brand-500 text-black border-brand-500' : 'bg-dark-700 text-white border-dark-600 hover:bg-dark-600'}`}>
                            <i className="fa-solid fa-pencil"></i> Notas
                        </button>
                    </div>

                    {showNotes && (
                        <div className="mb-4 animate-slide-down origin-top">
                            <textarea 
                                value={localNote} 
                                onChange={handleNoteChange} 
                                placeholder="Anotá acá configuraciones de la máquina, sensaciones, etc..." 
                                className="w-full bg-dark-800 text-white p-3 rounded-xl outline-none border border-dark-600 focus:border-brand-500 text-sm resize-none h-24 shadow-inner"
                            />
                        </div>
                    )}

                    {showHistory && (
                        <div className="mb-4 bg-dark-800 p-4 rounded-xl border border-dark-600 animate-slide-down origin-top shadow-inner text-sm">
                            <h5 className="font-bold text-white mb-3 flex items-center gap-2"><i className="fa-solid fa-chart-simple text-brand-500"></i> Progreso en este mesociclo</h5>
                            {[1, 2, 3, 4].map(w => {
                                const wData = allWeeksData?.[w]?.[exercise.id]?.sets;
                                if (!wData || wData.length === 0) return null;
                                return (
                                    <div key={w} className="mb-3 pb-3 border-b border-dark-700 last:border-0 last:mb-0 last:pb-0 text-gray-300">
                                        <span className="text-brand-500 font-bold block mb-1">Semana {w}:</span>
                                        <div className="flex flex-wrap gap-2">
                                            {wData.map((s, idx) => {
                                                if(s.weight && s.reps) return (
                                                    <span key={idx} className="bg-dark-700 px-2 py-1 rounded text-xs border border-dark-600">{s.weight}kg x {s.reps}</span>
                                                );
                                                return null;
                                            })}
                                        </div>
                                    </div>
                                )
                            })}
                            {!allWeeksData && <p className="text-gray-500 text-xs italic">Aún no hay registros en otras semanas.</p>}
                        </div>
                    )}
                    
                    <div className="grid grid-cols-[auto_1fr_1fr_1fr_auto] gap-2 mb-2 text-[10px] text-gray-500 font-bold uppercase tracking-widest px-2">
                        <span className="w-8 text-center">Serie</span>
                        <span className="text-center">Previa</span>
                        <span className="text-center">KG</span>
                        <span className="text-center">Repes</span>
                        <span className="w-10"></span>
                    </div>
                    
                    {localSets.map((set, i) => {
                        const prevSet = previousWeekData?.sets?.[i];
                        const prevText = prevSet?.weight && prevSet?.reps ? `${prevSet.weight} x ${prevSet.reps}` : '-';
                        
                        const isRight = isUni && (i % 2 !== 0);
                        const setNum = isUni ? Math.floor(i / 2) + 1 : i + 1;
                        const setType = set.type || 'N';
                        
                        let badgeText = setType === 'N' ? setNum : setType;
                        if (isUni) {
                            badgeText = `${badgeText}${isRight ? 'D' : 'I'}`;
                        }

                        let badgeStyle = "bg-dark-700 text-gray-400 border-dark-600";
                        if (setType === 'W') badgeStyle = "bg-orange-900/40 text-orange-500 border-orange-800";
                        else if (setType === 'D') badgeStyle = "bg-red-900/40 text-red-500 border-red-800";
                        else if (isUni) badgeStyle = isRight ? "bg-blue-900/30 text-blue-400 border-blue-900" : "bg-green-900/30 text-green-400 border-green-900";

                        return (
                            <div key={i} className={`grid grid-cols-[auto_1fr_1fr_1fr_auto] gap-2 items-center mb-2 p-1`}>
                                <button onClick={() => cycleSetType(i)} className={`w-8 h-8 flex items-center justify-center rounded-lg font-bold text-xs border cursor-pointer hover:opacity-80 transition-opacity ${badgeStyle}`}>
                                    {badgeText}
                                </button>
                                
                                <div className="text-center text-gray-500 text-sm font-medium">
                                    {prevText}
                                </div>

                                <div className="relative">
                                    <input type="number" className="w-full bg-dark-700 rounded-lg py-2.5 text-white outline-none text-center font-bold border border-dark-600 focus:border-brand-500 transition-colors" placeholder="-" value={set.weight} onChange={(e) => updateSet(i, 'weight', e.target.value)} />
                                </div>
                                
                                <div className="relative">
                                    <input type="number" className="w-full bg-dark-700 rounded-lg py-2.5 text-white outline-none text-center font-bold border border-dark-600 focus:border-brand-500 transition-colors" placeholder="-" value={set.reps} onChange={(e) => updateSet(i, 'reps', e.target.value)} />
                                </div>
                                
                                <button onClick={() => updateSet(i, 'done', !set.done)} className={`w-10 h-10 rounded-lg flex items-center justify-center transition-all ${set.done ? 'bg-brand-500 text-black shadow-[0_0_12px_rgba(167,199,231,0.4)]' : 'bg-dark-700 text-gray-500 border border-dark-600 hover:text-white'}`}>
                                    <i className="fa-solid fa-check"></i>
                                </button>
                            </div>
                        )
                    })}
                    <button onClick={addSet} className="w-full mt-4 bg-dark-700 text-brand-500 font-bold py-3 rounded-xl text-sm border border-dark-600 hover:bg-dark-600 transition-colors">
                        + Añadir serie {isUni ? 'I/D' : ''}
                    </button>
                </div>
            );
        }

        function App() {
            const [globalData, setGlobalData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('home'); 
            const [currentUser, setCurrentUser] = useState(null);
            const [pinInput, setPinInput] = useState('');
            const [newClientName, setNewClientName] = useState('');
            const [activeClient, setActiveClient] = useState(null);
            const [activeDayId, setActiveDayId] = useState(null);
            
            const [activeWeek, setActiveWeek] = useState(1); 
            const [isTrainingStarted, setIsTrainingStarted] = useState(false);
            const [trainingTime, setTrainingTime] = useState(0);
            const [restTime, setRestTime] = useState(0); 

            const [toast, setToast] = useState(null);
            const showToast = (msg, type = 'info') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3000);
            };

            useEffect(() => {
                fetchData();
                const channel = supabase.channel('realtime_sync').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'bravo_state' }, (payload) => {
                    if(payload && payload.new) setGlobalData(payload.new.data);
                }).subscribe();
                return () => { supabase.removeChannel(channel); };
            }, []);

            useEffect(() => {
                let interval = null;
                if (view === 'cliente_entrenamiento' && isTrainingStarted) {
                    interval = setInterval(() => setTrainingTime(t => t + 1), 1000);
                } else { clearInterval(interval); }
                return () => clearInterval(interval);
            }, [view, isTrainingStarted]);

            useEffect(() => {
                let restInterval = null;
                if (restTime > 0) {
                    restInterval = setInterval(() => {
                        setRestTime(t => {
                            if (t <= 1) {
                                if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
                                playAlarm();
                                return 0;
                            }
                            return t - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(restInterval);
            }, [restTime]);

            const startRest = (timeString) => {
                let t = parseInt(timeString);
                if (timeString.toLowerCase().includes('m')) t = t * 60;
                else if (isNaN(t)) t = 90; 
                setRestTime(t);
            };

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60).toString().padStart(2, '0');
                const s = (secs % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            const fetchData = async () => {
                try {
                    const { data } = await supabase.from('bravo_state').select('data').eq('id', 'main').single();
                    if (data) setGlobalData(data.data);
                } catch (e) { console.error(e); }
                setLoading(false);
            };

            const saveData = async (newData) => {
                setGlobalData(newData);
                await supabase.from('bravo_state').update({ data: newData }).eq('id', 'main');
            };

            const handleLogin = () => {
                if (!globalData) return;
                unlockAudio(); 
                
                if (pinInput === globalData.profesorPin) { setView('profesor'); } 
                else {
                    const client = globalData.clients?.find(c => c.pin === pinInput);
                    if (client) { 
                        setCurrentUser(client); 
                        setView('cliente_listado'); 
                    } else { showToast('PIN incorrecto. Revisalo bien.', 'error'); }
                }
                setPinInput('');
            };

            // PROFESOR
            const addClient = () => {
                if (!newClientName.trim()) return;
                const newData = JSON.parse(JSON.stringify(globalData));
                const newClient = { id: Date.now().toString(), name: newClientName, pin: Math.floor(1000 + Math.random() * 9000).toString() };
                if(!newData.clients) newData.clients = [];
                if(!newData.routines) newData.routines = {};
                if(!newData.progress) newData.progress = {};
                newData.clients.push(newClient);
                newData.routines[newClient.id] = [];
                saveData(newData);
                setNewClientName('');
                showToast(`¡Alumno creado! PIN: ${newClient.pin}`);
            };

            const addDay = (clientId) => {
                const newData = JSON.parse(JSON.stringify(globalData));
                const newId = Date.now().toString();
                newData.routines[clientId].push({ id: newId, name: "Nueva Plantilla", exercises: [] });
                saveData(newData);
            };

            const deleteDay = (clientId, dayId) => {
                const confirmacion = window.confirm('¿Seguro que querés borrar esta plantilla entera?');
                if (!confirmacion) return;
                const newData = JSON.parse(JSON.stringify(globalData));
                newData.routines[clientId] = newData.routines[clientId].filter(d => d.id !== dayId);
                saveData(newData);
                setActiveDayId(null);
                showToast('Plantilla eliminada');
            };

            const cloneDay = (clientId, dayId) => {
                const newData = JSON.parse(JSON.stringify(globalData));
                const dayToClone = newData.routines[clientId].find(d => d.id === dayId);
                if (!dayToClone) return;

                const newDay = {
                    id: Date.now().toString(),
                    name: dayToClone.name + " (Copia)",
                    exercises: dayToClone.exercises.map(ex => ({
                        ...ex,
                        id: Math.random().toString(36).substr(2, 9)
                    }))
                };

                newData.routines[clientId].push(newDay);
                saveData(newData);
                showToast('Plantilla duplicada con éxito');
            };

            const addExercise = (clientId, dayId) => {
                const newData = JSON.parse(JSON.stringify(globalData));
                const day = newData.routines[clientId].find(d => d.id === dayId);
                
                // Por defecto aplicamos el método de hipertrofia lineal
                const defaultMethod = 'hipertrofia_lineal';
                day.exercises.push({ 
                    id: Date.now().toString(), 
                    name: '', 
                    method: defaultMethod,
                    weeks: JSON.parse(JSON.stringify(TRAINING_METHODS[defaultMethod].weeks)),
                    rir: '2', 
                    rest: '90s', 
                    isUnilateral: false 
                });
                saveData(newData);
            };

            const updateExercise = (clientId, dayId, updatedExercise) => {
                const newData = JSON.parse(JSON.stringify(globalData));
                const day = newData.routines[clientId].find(d => d.id === dayId);
                const index = day.exercises.findIndex(e => e.id === updatedExercise.id);
                day.exercises[index] = updatedExercise;
                saveData(newData);
            };

            const deleteExercise = (clientId, dayId, exerciseId) => {
                const newData = JSON.parse(JSON.stringify(globalData));
                const day = newData.routines[clientId].find(d => d.id === dayId);
                day.exercises = day.exercises.filter(e => e.id !== exerciseId);
                saveData(newData);
            };

            // ALUMNO
            const saveClientProgress = (exerciseId, setsArray, noteString, week) => {
                const newData = JSON.parse(JSON.stringify(globalData));
                if (!newData.progress[currentUser.id]) newData.progress[currentUser.id] = {};
                if (!newData.progress[currentUser.id][week]) newData.progress[currentUser.id][week] = {};
                if (!newData.progress[currentUser.id][week][exerciseId]) newData.progress[currentUser.id][week][exerciseId] = {};
                
                if (setsArray) newData.progress[currentUser.id][week][exerciseId].sets = setsArray;
                if (noteString !== undefined) newData.progress[currentUser.id][week][exerciseId].note = noteString;
                
                saveData(newData);
            };

            if (loading) return <div className="app-container flex justify-center items-center h-screen bg-black text-brand-500 text-2xl font-bold"><i className="fa-solid fa-spinner fa-spin mr-3"></i> Cargando...</div>;

            return (
                <div className="relative">
                    {toast && (
                        <div className={`fixed top-6 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-full text-sm font-bold shadow-2xl animate-slide-down text-center flex items-center gap-3 whitespace-nowrap ${toast.type === 'error' ? 'bg-red-600 text-white' : 'bg-brand-500 text-black'}`}>
                            {toast.type === 'error' ? <i className="fa-solid fa-triangle-exclamation"></i> : <i className="fa-solid fa-bell"></i>}
                            {toast.msg}
                        </div>
                    )}

                    {view === 'home' && (
                        <div className="app-container flex flex-col justify-center p-6 space-y-8 bg-black h-screen">
                            <div className="text-center animate-fade-in">
                                <div className="flex justify-center items-center gap-4 text-6xl text-brand-500 mb-6 drop-shadow-[0_0_15px_rgba(167,199,231,0.5)]">
                                    <i className="fa-solid fa-brain"></i>
                                    <i className="fa-solid fa-hand-fist"></i>
                                </div>
                                <h1 className="text-4xl font-black text-white uppercase tracking-widest mb-1">Entrenamiento</h1>
                                <h2 className="text-2xl font-bold text-brand-500 lowercase">y salud</h2>
                            </div>
                            <div className="bg-dark-700 p-6 rounded-3xl border border-dark-600 shadow-2xl">
                                <input type="password" placeholder="PIN" className="w-full bg-dark-800 p-4 rounded-xl text-center text-2xl tracking-[0.5em] outline-none mb-4 text-white border border-dark-600 focus:border-brand-500 transition-colors" value={pinInput} onChange={(e) => setPinInput(e.target.value)} />
                                <button onClick={handleLogin} className="w-full bg-brand-500 text-black py-4 rounded-xl font-bold text-lg hover:bg-brand-600 transition-colors shadow-lg shadow-brand-500/20">Entrar</button>
                            </div>
                        </div>
                    )}

                    {view === 'profesor' && (
                        <div className="app-container pb-20">
                            {activeClient ? (
                                activeDayId && globalData.routines[activeClient.id]?.find(d => d.id === activeDayId) ? (
                                    <>
                                        <header className="p-4 flex items-center justify-between sticky top-0 bg-black/90 backdrop-blur z-10 border-b border-dark-700">
                                            <button onClick={() => setActiveDayId(null)} className="text-brand-500 w-10 h-10 flex items-center justify-center hover:text-white transition-colors"><i className="fa-solid fa-arrow-left text-xl"></i></button>
                                            <h2 className="font-bold text-lg text-white">Editar Plantilla</h2>
                                            <div className="w-10"></div>
                                        </header>
                                        <div className="p-4">
                                            <input className="font-black text-3xl lowercase bg-transparent outline-none text-white w-full mb-6 border-b border-transparent focus:border-brand-500 transition-colors placeholder-gray-600" value={globalData.routines[activeClient.id].find(d => d.id === activeDayId).name} placeholder="Nombre del día..." onChange={(e) => {
                                                const newData = JSON.parse(JSON.stringify(globalData));
                                                newData.routines[activeClient.id].find(d => d.id === activeDayId).name = e.target.value;
                                                saveData(newData);
                                            }}/>
                                            {globalData.routines[activeClient.id].find(d => d.id === activeDayId).exercises.map(ex => (
                                                <ExerciseRow key={ex.id} exercise={ex} onUpdate={(u) => updateExercise(activeClient.id, activeDayId, u)} onDelete={() => deleteExercise(activeClient.id, activeDayId, ex.id)} />
                                            ))}
                                            <button onClick={() => addExercise(activeClient.id, activeDayId)} className="w-full bg-brand-500 text-black font-bold py-4 rounded-xl mt-4 hover:bg-brand-600 transition-colors shadow-lg shadow-brand-500/20">
                                                <i className="fa-solid fa-plus mr-2"></i> Agregar ejercicio
                                            </button>
                                        </div>
                                    </>
                                ) : (
                                    <>
                                        <header className="p-4 flex items-center justify-between sticky top-0 bg-black/90 backdrop-blur z-10 border-b border-dark-700">
                                            <button onClick={() => setActiveClient(null)} className="text-brand-500 w-10 h-10 flex items-center justify-center hover:text-white transition-colors"><i className="fa-solid fa-arrow-left text-xl"></i></button>
                                            <h2 className="font-bold text-lg text-white">{activeClient.name}</h2>
                                            <div className="w-10"></div>
                                        </header>
                                        
                                        <div className="p-4">
                                            <h3 className="font-bold text-xl mb-4 text-white">Tus plantillas</h3>
                                            <div className="space-y-4">
                                                {(globalData.routines[activeClient.id] || []).map(day => (
                                                    <div key={day.id} onClick={() => setActiveDayId(day.id)} className="flex items-center gap-4 cursor-pointer bg-dark-700 p-3 rounded-2xl border border-dark-600 hover:border-brand-500 transition-colors">
                                                        <div className="w-16 h-16 bg-white rounded-lg shrink-0 flex items-center justify-center text-black">
                                                            <i className="fa-solid fa-file-lines text-2xl"></i>
                                                        </div>
                                                        <div className="flex-1 overflow-hidden">
                                                            <h4 className="font-bold text-lg text-white truncate lowercase">{day.name}</h4>
                                                            <p className="text-sm text-gray-500 truncate">{day.exercises.map(e => e.name).join(', ') || 'Sin ejercicios'}</p>
                                                        </div>
                                                        <div className="flex items-center gap-1">
                                                            <button onClick={(e) => { e.stopPropagation(); cloneDay(activeClient.id, day.id); }} className="text-gray-400 px-3 py-2 hover:text-brand-500 transition-colors"><i className="fa-solid fa-copy"></i></button>
                                                            <button onClick={(e) => { e.stopPropagation(); deleteDay(activeClient.id, day.id); }} className="text-gray-400 px-3 py-2 hover:text-red-500 transition-colors"><i className="fa-solid fa-trash-can"></i></button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                            <button onClick={() => addDay(activeClient.id)} className="mt-6 flex items-center justify-center gap-3 text-black font-bold w-full bg-brand-500 p-4 rounded-xl hover:bg-brand-600 transition-colors shadow-lg shadow-brand-500/20">
                                                <i className="fa-regular fa-folder text-xl"></i> Crear nueva plantilla
                                            </button>
                                        </div>
                                    </>
                                )
                            ) : (
                                <>
                                    <header className="p-5 flex justify-between items-center bg-black sticky top-0 border-b border-dark-700 z-10">
                                        <h2 className="font-black text-2xl text-white">Alumnos</h2>
                                        <button onClick={() => setView('home')} className="text-brand-500 hover:text-white transition-colors flex items-center gap-2 font-bold"><i className="fa-solid fa-arrow-right-from-bracket"></i> Salir</button>
                                    </header>
                                    <div className="p-5 space-y-3">
                                        <div className="flex gap-2 bg-dark-800 p-2 rounded-2xl border border-dark-600 shadow-inner mb-6">
                                            <input className="flex-1 bg-transparent px-4 outline-none text-sm text-white focus:placeholder-gray-600" placeholder="Nombre del alumno nuevo..." value={newClientName} onChange={(e) => setNewClientName(e.target.value)} />
                                            <button onClick={addClient} className="bg-brand-500 rounded-xl w-10 h-10 flex items-center justify-center text-black hover:bg-brand-600 transition-colors shadow-md shadow-brand-500/30"><i className="fa-solid fa-plus"></i></button>
                                        </div>

                                        {globalData.clients?.map(client => (
                                            <div key={client.id} onClick={() => setActiveClient(client)} className="bg-dark-700 p-5 rounded-2xl flex justify-between items-center cursor-pointer border border-dark-600 hover:border-brand-500 transition-all">
                                                <div>
                                                    <p className="font-bold text-lg text-white">{client.name}</p>
                                                    <p className="text-xs text-brand-500 mt-1"><i className="fa-solid fa-key mr-1"></i> PIN: {client.pin}</p>
                                                </div>
                                                <i className="fa-solid fa-chevron-right text-gray-500"></i>
                                            </div>
                                        ))}
                                    </div>
                                </>
                            )}
                        </div>
                    )}

                    {view === 'cliente_listado' && (
                        <div className="app-container pb-20">
                            <header className="p-5 flex justify-between items-center sticky top-0 bg-black/90 backdrop-blur z-10 border-b border-dark-700">
                                <h1 className="text-lg font-black text-white tracking-widest flex items-center gap-2">
                                    <i className="fa-solid fa-brain text-brand-500 text-xl"></i>
                                    <i className="fa-solid fa-hand-fist text-brand-500 text-xl"></i>
                                    <span className="flex flex-col ml-1">
                                        <span className="text-sm leading-none uppercase">Entrenamiento</span>
                                        <span className="text-[10px] leading-none text-brand-500 mt-1 uppercase">y salud</span>
                                    </span>
                                </h1>
                                <button onClick={() => setView('home')} className="text-black bg-white px-4 py-1.5 rounded-full text-xs font-bold shadow-md">Salir</button>
                            </header>

                            <div className="p-5">
                                <h3 className="font-bold text-xl mb-4 text-white">Mesociclo actual</h3>
                                <div className="flex bg-dark-700 rounded-full p-1.5 mb-8 border border-dark-600">
                                    {[1, 2, 3, 4].map(num => (
                                        <button key={num} onClick={() => setActiveWeek(num)} className={`flex-1 py-2 text-sm font-bold rounded-full transition-all ${activeWeek === num ? 'bg-brand-500 text-black shadow-md' : 'text-gray-400 hover:text-white'}`}>Sem. {num}</button>
                                    ))}
                                </div>

                                <h3 className="font-bold text-xl mb-6 text-white">Tus plantillas</h3>
                                <div className="space-y-6">
                                    {(globalData.routines[currentUser.id] || []).map(day => (
                                        <div key={day.id} onClick={() => {setActiveDayId(day.id); setIsTrainingStarted(false); setView('cliente_entrenamiento');}} className="flex items-center gap-4 cursor-pointer group bg-dark-800 p-3 rounded-2xl border border-transparent hover:border-brand-500/50 transition-all">
                                            <div className="w-16 h-16 bg-white rounded-xl shrink-0 flex items-center justify-center text-black shadow-lg">
                                                <i className="fa-solid fa-dumbbell text-2xl"></i>
                                            </div>
                                            <div className="flex-1 overflow-hidden border-b border-dark-700 pb-3 group-last:border-0 pt-1">
                                                <h4 className="font-bold text-lg text-white truncate lowercase">{day.name}</h4>
                                                <p className="text-sm text-gray-500 truncate">{day.exercises.map(e => e.name).join(', ') || 'Sin ejercicios'}</p>
                                            </div>
                                            <i className="fa-solid fa-ellipsis-vertical text-gray-600 pr-2"></i>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            
                            <div className="fixed bottom-0 left-1/2 transform -translate-x-1/2 w-full max-w-[480px] bg-black/95 backdrop-blur border-t border-dark-700 flex justify-around p-4 text-gray-500 pb-6">
                                <button className="text-brand-500 flex flex-col items-center gap-1"><i className="fa-solid fa-dumbbell text-xl"></i><span className="text-[10px] font-bold">Entrenar</span></button>
                                <button onClick={() => showToast('Próximamente: Historial general de todas las rutinas')} className="hover:text-white transition-colors flex flex-col items-center gap-1"><i className="fa-solid fa-chart-line text-xl"></i><span className="text-[10px] font-bold">Progreso</span></button>
                                <button onClick={() => showToast('Próximamente: Perfil y configuración')} className="hover:text-white transition-colors flex flex-col items-center gap-1"><i className="fa-regular fa-user text-xl"></i><span className="text-[10px] font-bold">Perfil</span></button>
                            </div>
                        </div>
                    )}

                    {view === 'cliente_entrenamiento' && (
                        !isTrainingStarted ? (
                            <div className="app-container pb-24">
                                <header className="p-4 flex items-center justify-between sticky top-0 bg-black/90 backdrop-blur z-10 border-b border-dark-700">
                                    <button onClick={() => setView('cliente_listado')} className="text-brand-500 w-10 h-10 flex items-center justify-center hover:text-white transition-colors"><i className="fa-solid fa-arrow-left text-xl"></i></button>
                                    <button onClick={() => showToast('Próximamente: Inteligencia Artificial para modificar la rutina')} className="bg-dark-700 text-white px-4 py-1.5 rounded-full text-sm font-bold flex items-center gap-2 border border-dark-600 hover:border-brand-500 transition-colors"><i className="fa-solid fa-wand-magic-sparkles text-brand-500"></i> Adaptar</button>
                                </header>

                                <div className="p-5">
                                    <h2 className="font-black text-4xl lowercase text-white mb-1">{(globalData.routines[currentUser.id]?.find(d => d.id === activeDayId) || {}).name}</h2>
                                    <p className="text-gray-400 mb-8 font-medium">Semana {activeWeek} • {(globalData.routines[currentUser.id]?.find(d => d.id === activeDayId) || {}).exercises?.length} Ejercicios planificados</p>

                                    <div className="flex justify-between items-center mb-6">
                                        <h3 className="font-bold text-xl text-white">Lista de Ejercicios</h3>
                                    </div>

                                    <div className="space-y-6">
                                        {(globalData.routines[currentUser.id]?.find(d => d.id === activeDayId) || {}).exercises?.map((ex) => {
                                            const methodKey = ex.method || 'hipertrofia_lineal';
                                            const defCfg = TRAINING_METHODS[methodKey]?.weeks[activeWeek] || { sets: '4', reps: '10' };
                                            const wCfg = ex.weeks?.[activeWeek] || defCfg;
                                            return (
                                                <div key={ex.id} className="flex gap-4 items-center bg-dark-800 p-3 rounded-2xl border border-dark-700">
                                                    <div className="w-14 h-14 bg-white rounded-full flex items-center justify-center shrink-0 shadow-md">
                                                        <i className="fa-solid fa-dumbbell text-black text-xl"></i>
                                                    </div>
                                                    <div className="flex-1">
                                                        <p className="text-xs text-brand-500 font-bold mb-1 tracking-wider">{wCfg.sets} SERIES x {wCfg.reps} REPS</p>
                                                        <p className="font-bold text-white text-base leading-tight">{ex.name}</p>
                                                    </div>
                                                    <i className="fa-solid fa-ellipsis-vertical text-gray-600 px-2"></i>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="fixed bottom-0 left-1/2 transform -translate-x-1/2 w-full max-w-[480px] bg-black/90 backdrop-blur p-5 border-t border-dark-700">
                                    <button onClick={() => { setIsTrainingStarted(true); setTrainingTime(0); setRestTime(0); unlockAudio(); }} className="w-full bg-brand-500 text-black font-black text-lg py-4 rounded-2xl flex items-center justify-center gap-2 hover:bg-brand-600 transition-colors shadow-lg shadow-brand-500/20">
                                        <i className="fa-solid fa-play"></i> Empezar Entrenamiento
                                    </button>
                                </div>
                            </div>
                        ) : (
                            <div className="app-container pb-20">
                                <header className="p-4 flex items-center justify-between sticky top-0 bg-black/95 backdrop-blur z-20 border-b border-dark-700 shadow-md">
                                    <button onClick={() => showToast('Próximamente: Temporizador general')} className="text-brand-500 font-bold flex items-center gap-2 hover:text-white transition-colors"><i className="fa-solid fa-chevron-down"></i> {formatTime(trainingTime)}</button>
                                    <button onClick={() => { setIsTrainingStarted(false); showToast(`¡Entrenamiento finalizado! Tiempo: ${formatTime(trainingTime)}`); setView('cliente_listado'); }} className="bg-dark-700 text-brand-500 px-5 py-2 rounded-xl text-sm font-bold border border-dark-600 hover:bg-dark-600 transition-colors shadow-sm">Terminar</button>
                                </header>

                                <div className="p-4 pt-6">
                                    {(globalData.routines[currentUser.id]?.find(d => d.id === activeDayId) || {}).exercises?.map(ex => (
                                        <ClientExerciseRow 
                                            key={`${ex.id}-${activeWeek}`} 
                                            exercise={ex} 
                                            activeWeek={activeWeek}
                                            progressData={globalData.progress?.[currentUser.id]?.[activeWeek]?.[ex.id]} 
                                            previousWeekData={globalData.progress?.[currentUser.id]?.[activeWeek > 1 ? activeWeek - 1 : 1]?.[ex.id]}
                                            allWeeksData={globalData.progress?.[currentUser.id]}
                                            onSaveProgress={(setsArray, noteString) => saveClientProgress(ex.id, setsArray, noteString, activeWeek)} 
                                            onStartRest={startRest}
                                            showToast={showToast}
                                        />
                                    ))}
                                </div>

                                {/* Cronómetro Flotante */}
                                {restTime > 0 && (
                                    <div className="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-brand-500 text-black px-6 py-3 rounded-full font-bold text-lg shadow-[0_0_25px_rgba(167,199,231,0.6)] flex items-center gap-3 z-50 animate-bounce cursor-pointer" onClick={() => setRestTime(0)}>
                                        <i className="fa-solid fa-stopwatch animate-pulse text-xl"></i>
                                        {Math.floor(restTime/60)}:{(restTime%60).toString().padStart(2,'0')}
                                        <div className="ml-2 bg-black/20 hover:bg-black/40 transition-colors rounded-full w-8 h-8 flex items-center justify-center"><i className="fa-solid fa-xmark"></i></div>
                                    </div>
                                )}
                            </div>
                        )
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(getElementById('root') || document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
